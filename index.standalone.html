/* ============================ 敌机开火 ============================ */
function updateEnemyFire(pools, dt, player, bulletSpeedMul) {
  const items = pools.enemy.items;
  for (let i = 0; i < items.length; i++) {
    const e = items[i];
    if (!e.active || e.spawnDelay > 0) continue;
    if (!e.fireInterval || !e.cfg.bulletPattern) continue;
    if (e.y < 20 || e.y > GAME_H - 200) continue;
    e.fireTimer -= dt;
    if (e.fireTimer > 0) continue;
    e.fireTimer = e.fireInterval / Math.max(0.4, e.attackMul);
    spawnPattern(e.cfg.bulletPattern, e.x, e.y + e.radius * 0.6, {
      speedMul: bulletSpeedMul
    }, pools, player);
  }
}

/* ============================ Boss 弹幕编排 ============================ */
class BossController {
  constructor(boss) {
    this.boss = boss;
    this.seqT = 0;
    this.idx = 0;
    this.bursts = [];
    this.lastPhase = boss.phaseIdx;
  }

  reset() { this.seqT = 0; this.idx = 0; this.bursts.length = 0; this.lastPhase = this.boss.phaseIdx; }

  update(dt, pools, player, bulletSpeedMul) {
    const boss = this.boss;
    if (!boss.active) return;
    if (boss.state !== 'combat') { this.bursts.length = 0; return; }
    if (this.lastPhase !== boss.phaseIdx) { this.reset(); }

    const seqDef = boss.cfg.sequences[boss.currentPhaseDef.seq];
    if (!seqDef) return;
    const rngFreeze = boss.state === 'transition';

    this.seqT += dt;
    while (this.idx < seqDef.seq.length && seqDef.seq[this.idx].t <= this.seqT) {
      const step = seqDef.seq[this.idx];
      const base = PATTERNS[step.p];
      const merged = Object.assign({}, step.o || {});
      if (base && base.bursts && base.bursts > 1 && merged.bursts === undefined) {
        // 需要多轮连续发射的弹幕（螺旋）放入爆发队列
        this.bursts.push({
          pattern: step.p, x: boss.x, y: boss.y,
          opts: merged, remaining: base.bursts, timer: 0,
          interval: merged.interval || base.interval || 0.06,
          offset: merged.offsetDeg || 0,
          step: base.offsetDegPerShot || 12, follow: true
        });
      } else {
        spawnPattern(step.p, boss.x, boss.y, merged, pools, player);
      }
      this.idx++;
    }
    if (this.seqT >= seqDef.loop) { this.seqT -= seqDef.loop; this.idx = 0; }

    // 爆发队列
    for (let i = this.bursts.length - 1; i >= 0; i--) {
      const q = this.bursts[i];
      q.timer -= dt;
      if (q.timer <= 0) {
        q.timer = q.interval;
        if (q.follow) { q.x = boss.x; q.y = boss.y; }
        const o = Object.assign({}, q.opts, { offsetDeg: q.offset });
        o.speedMul = bulletSpeedMul;
        spawnPattern(q.pattern, q.x, q.y, o, pools, player);
        q.offset += q.step;
        q.remaining--;
        if (q.remaining <= 0) this.bursts.splice(i, 1);
      }
    }
  }
}

/* ============================ 子弹更新（含地雷逻辑） ============================ */
function updateBullets(pool, dt, pools) {
  const items = pool.items;
  for (let i = 0; i < items.length; i++) {
    const b = items[i];
    if (!b.active) continue;
    b.update(dt);
    // 地雷：飞行到时间后静止并爆散
    if (b.mineT > 0) {
      b.mineT -= dt;
      b.vx *= Math.max(0, 1 - dt * 4);
      b.vy *= Math.max(0, 1 - dt * 4);
      if (b.mineT <= 0) {
        spawnPattern(b.minePattern, b.x, b.y, { count: b.mineCount, speed: 190 }, pools, null);
        spawnRing(pools.particle, b.x, b.y, b.color, 56);
        pool.release(b);
        continue;
      }
    }
    if (!b.homing && !b.mineT && b.offscreen()) {
      pool.release(b);
      continue;
    }
    if (b.life <= 0) pool.release(b);
  }
}

function updateBeams(pool, dt) {
  const items = pool.items;
  for (let i = 0; i < items.length; i++) {
    const b = items[i];
    if (!b.active) continue;
    b.update(dt);
    if (b.life <= 0) pool.release(b);
  }
}

/* ============================ 波次生成 ============================ */
function formationSlot(formation, i, count, wave) {
  const margin = 90;
  const span = GAME_W - margin * 2;
  switch (formation) {
    case 'vFormation': {
      const t = count === 1 ? 0 : i / (count - 1) - 0.5;
      return { x: GAME_W / 2 + t * GAME_W * 0.72, dy: Math.abs(t) * 190, dir: 0 };
    }
    case 'lineUp': {
      const t = count === 1 ? 0.5 : i / (count - 1);
      return { x: margin + span * t, dy: 0, dir: 0 };
    }
    case 'sineFormation': {
      const t = count === 1 ? 0.5 : i / (count - 1);
      return { x: margin + span * t, dy: 0, dir: 0 };
    }
    case 'arcEntry': {
      const t = count === 1 ? 0.5 : i / (count - 1);
      return { x: margin + span * t, dy: 0, dir: i % 2 === 0 ? -1 : 1 };
    }
    case 'straightDown': {
      return { x: randRange(60, GAME_W - 60), dy: randRange(0, 30), dir: Math.random() < 0.5 ? -1 : 1 };
    }
    case 'center':
      return { x: GAME_W / 2, dy: 0, dir: 1 };
    case 'sides':
      return { x: i % 2 === 0 ? 120 : GAME_W - 120, dy: (i >> 1) * 90, dir: i % 2 === 0 ? 1 : -1 };
    default:
      return { x: margin + span * (count === 1 ? 0.5 : i / (count - 1)), dy: 0, dir: 0 };
  }
}

class Spawner {
  constructor(levelCfg, opts) {
    this.level = levelCfg;
    this.opts = opts || {};
    this.t = 0;
    this.waveIdx = 0;
    this.finished = false;
    this.endless = !!this.opts.endless;
    this.endlessWave = 0;
    this.endlessTimer = 0;
    this.endlessInterval = BALANCE.endless.spawnIntervalStart;
    this.bossPending = false;
    this.waveT = 0;
  }

  update(dt, pools, player) {
    this.t += dt;
    if (this.endless) return this._updateEndless(dt, pools);
    const waves = this.level.waves;
    while (this.waveIdx < waves.length && this.t >= waves[this.waveIdx].at) {
      this._spawnWave(waves[this.waveIdx], pools);
      this.waveIdx++;
    }
    if (this.waveIdx >= waves.length && !this.finished) this.finished = true;
  }

  _updateEndless(dt, pools) {
    // 已排队 Boss：暂停刷怪，等场景取走（clearEndlessBossPending）
    if (this.bossPending) return;

    // 波次推进：每波持续 waveDuration 秒的连续刷怪
    this.waveT += dt;
    if (this.waveT >= BALANCE.endless.waveDuration) {
      this.waveT = 0;
      this.endlessWave++;
      if (this.endlessWave % BALANCE.endlessBossEvery === 0) {
        this.bossPending = true;   // 交给场景触发 Boss
        return;
      }
      this.endlessInterval = Math.max(
        BALANCE.endless.spawnIntervalMin,
        this.endlessInterval - BALANCE.endless.spawnIntervalDecay
      );
    }

    this.endlessTimer -= dt;
    if (this.endlessTimer > 0) return;
    this.endlessTimer = this.endlessInterval;

    const w = this.endlessWave + 1;   // 当前正在进行的波次（从 1 开始）
    const ids = ['scout', 'weaver', 'kamikaze', 'turret', 'shielded', 'splitter', 'carrier'];
    const id = ids[Math.min(ids.length - 1, Math.floor(w / 2))];
    const count = Math.min(10, 4 + Math.floor(w / 2));
    const form = ['vFormation', 'lineUp', 'arcEntry', 'sineFormation', 'sides'][w % 5];
    this._spawnWave({ spawn: id, count, formation: form }, pools, 1 + 0.12 * (w - 1));
  }

  clearEndlessBossPending() {
    this.bossPending = false;
    this.endlessTimer = BALANCE.endless.spawnIntervalStart;
    this.waveT = 0;
  }

  get shouldSpawnBoss() {
    if (!this.endless) return this.t >= this.level.bossAt;
    return this.bossPending;
  }

  _spawnWave(wave, pools, hpMulOverride) {
    const cfg = ENEMIES[wave.spawn];
    if (!cfg) return;
    const count = wave.count || 1;
    const spacing = wave.interval ? Math.max(28, wave.interval * cfg.speed) : 60;
    for (let i = 0; i < count; i++) {
      const e = pools.enemy.acquire();
      if (!e) break;
      const slot = formationSlot(wave.formation || 'lineUp', i, count, wave);
      e.init(cfg, slot.x, -60 - i * spacing, {
        hpMul: hpMulOverride || this.opts.hpMul || 1,
        speedMul: this.opts.speedMul || 1,
        bulletSpeedMul: this.opts.bulletSpeedMul || 1,
        attackMul: this.opts.attackMul || 1,
        dir: slot.dir,
        targetY: 150 + (i % 3) * 70
      });
    }
  }
}

/* ============================ 连击系统 ============================ */
class ComboSystem {
  constructor() {
    this.combo = 0;
    this.timer = 0;
    this.maxCombo = 0;
    this.lastMilestone = 0;
  }
  reset() { this.combo = 0; this.timer = 0; this.maxCombo = 0; this.lastMilestone = 0; }
  add(n) {
    this.combo += (n || 1);
    this.timer = BALANCE.comboWindow;
    if (this.combo > this.maxCombo) this.maxCombo = this.combo;
    const ms = Math.floor(this.combo / BALANCE.comboPerStep);
    if (ms > this.lastMilestone) {
      this.lastMilestone = ms;
      eventBus.emit(EV.COMBO_CHANGED, { combo: this.combo, milestone: true });
    }
    return this.multiplier;
  }
  update(dt) {
    if (this.combo <= 0) return;
    this.timer -= dt;
    if (this.timer <= 0) {
      this.combo = 0;
      this.timer = 0;
      this.lastMilestone = 0;
      eventBus.emit(EV.COMBO_CHANGED, { combo: 0, milestone: false });
    }
  }
  get multiplier() {
    return Math.min(
      BALANCE.comboMaxMul,
      1 + Math.floor(this.combo / BALANCE.comboPerStep) * BALANCE.comboStepMul
    );
  }
}

/* ============================ 掉落 ============================ */
function spawnDrops(enemy, pools) {
  const cfg = enemy.cfg;
  if (!cfg.drop || cfg.drop.length === 0) return;
  for (let i = 0; i < cfg.drop.length; i++) {
    const d = cfg.drop[i];
    if (Math.random() > (d.chance === undefined ? 1 : d.chance)) continue;
    let kind = d.kind;
    if (cfg.dropRandom) kind = pick(cfg.dropRandom);
    const p = pools.pickup.acquire();
    if (!p) continue;
    p.init(kind, enemy.x + randRange(-14, 14), enemy.y, DROPS[kind]);
  }
}

/* ============================ 技能 ============================ */
function useBomb(scene) {
  const player = scene.player;
  if (player.bombs <= 0) return false;
  player.bombs--;
  // 清除全屏敌弹 → 转化为分数粒子
  const eb = scene.pools.enemyBullet.items;
  for (let i = 0; i < eb.length; i++) {
    const b = eb[i];
    if (!b.active) continue;
    spawnTrail(scene.pools.particle, b.x, b.y, THEME.warnYellow, 5);
    scene.pools.enemyBullet.release(b);
    scene.addScore(5, b.x, b.y, THEME.warnYellow, false, true);
  }
  const beams = scene.pools.beam.items;
  for (let i = 0; i < beams.length; i++) {
    if (beams[i].active && beams[i].faction === 'enemy') scene.pools.beam.release(beams[i]);
  }
  // 全场伤害
  const en = scene.pools.enemy.items;
  for (let i = 0; i < en.length; i++) {
    if (!en[i].active) continue;
    scene.damageEnemy(en[i], BALANCE.bombDamage, true);
  }
  if (scene.boss && scene.boss.active) scene.damageBoss(null, BALANCE.bombDamage * 0.35);
  spawnRing(scene.pools.particle, player.x, player.y, THEME.neonCyan, 900);
  spawnRing(scene.pools.particle, player.x, player.y, '#FFFFFF', 620);
  camera.flashScreen('#FFFFFF', 0.75);
  camera.shake(22, 0.5);
  loop.freeze(6);
  scene.slowMo(0.6, 0.45);
  eventBus.emit(EV.SKILL_USED, { kind: 'bomb' });
  return true;
}

function useSlow(scene) {
  const player = scene.player;
  if (player.energy < BALANCE.slowCost) return false;
  player.energy -= BALANCE.slowCost;
  loop.setTimeScale(BALANCE.slowScale, BALANCE.slowDuration * player.slowMul);
  camera.setTint(THEME.neonCyan, 0.12);
  camera.flashScreen(THEME.neonCyan, 0.25);
  eventBus.emit(EV.SKILL_USED, { kind: 'slow' });
  return true;
}

function useShieldNova(scene) {
  const player = scene.player;
  if (player.shield <= 0 || scene.shieldNovaCd > 0) return false;
  player.shield--;
  scene.shieldNovaCd = BALANCE.shieldNovaCooldown;
  const en = scene.pools.enemy.items;
  const R = 340;
  for (let i = 0; i < en.length; i++) {
    const e = en[i];
    if (!e.active) continue;
    const d = dist(e.x, e.y, player.x, player.y);
    if (d > R) continue;
    const a = angleTo(player.x, player.y, e.x, e.y);
    e.vx = Math.cos(a) * 460;
    e.vy = Math.sin(a) * 460;
    e.speed = 0;
    e.cfg = Object.assign({}, e.cfg, { pattern: 'straightDown' });
    scene.damageEnemy(e, 90, true);
  }
  spawnRing(scene.pools.particle, player.x, player.y, THEME.neonPurple, R);
  camera.shake(14, 0.35);
  camera.flashScreen(THEME.neonPurple, 0.4);
  eventBus.emit(EV.SKILL_USED, { kind: 'shieldNova' });
  return true;
}

/* ============================ 碰撞调度 ============================ */
function updateCollisions(scene) {
  const pools = scene.pools;
  const player = scene.player;
  const boss = scene.boss;

  // —— 建立敌机/部位网格 ——
  enemyGrid.clear();
  const enemyItems = pools.enemy.items;
  for (let i = 0; i < enemyItems.length; i++) {
    if (enemyItems[i].active) enemyGrid.insert(enemyItems[i]);
  }

  // 1) 玩家子弹 × 敌机 / Boss
  const pb = pools.playerBullet.items;
  for (let i = 0; i < pb.length; i++) {
    const b = pb[i];
    if (!b.active) continue;
    let consumed = false;

    enemyGrid.query(b.x, b.y, b.radius + 44, _bQuery);
    for (let j = 0; j < _bQuery.length; j++) {
      const e = _bQuery[j];
      if (!e.active || e.spawnDelay > 0) continue;
      const rr = e.radius + b.radius;
      if ((e.x - b.x) * (e.x - b.x) + (e.y - b.y) * (e.y - b.y) > rr * rr) continue;
      scene.damageEnemy(e, b.damage, false);
      spawnHitSpark(pools.particle, b.x, b.y, b.color);
      if (b.explodeRadius > 0) scene.areaDamage(b.x, b.y, b.explodeRadius, b.damage * 0.6);
      if (b.pierce > 0) b.pierce--;
      else { pools.playerBullet.release(b); consumed = true; }
      break;
    }
    if (consumed) continue;

    // Boss 判定（部位优先）
    if (boss && boss.active && boss.state !== 'dying' && boss.state !== 'entry') {
      let hitPart = null;
      for (let k = 0; k < boss.parts.length; k++) {
        const p = boss.parts[k];
        const rr = p.radius + b.radius;
        if ((p.x - b.x) * (p.x - b.x) + (p.y - b.y) * (p.y - b.y) <= rr * rr) { hitPart = p; break; }
      }
      const br = boss.radius + b.radius;
      const bodyHit = (boss.x - b.x) * (boss.x - b.x) + (boss.y - b.y) * (boss.y - b.y) <= br * br;
      if (hitPart || bodyHit) {
        scene.damageBoss(hitPart, b.damage);
        spawnHitSpark(pools.particle, b.x, b.y, b.color);
        if (b.explodeRadius > 0) scene.areaDamage(b.x, b.y, b.explodeRadius, b.damage * 0.6);
        if (b.pierce > 0) b.pierce--;
        else pools.playerBullet.release(b);
      }
    }
  }

  // 2) 玩家激光 × 敌机 / Boss
  const beams = pools.beam.items;
  for (let i = 0; i < beams.length; i++) {
    const bm = beams[i];
    if (!bm.active || bm.faction !== 'player' || bm.state !== 'active') continue;
    if (bm.beamTick > 0) continue;
    bm.beamTick = 0.1;
    const dmg = bm.dps * 0.1;
    for (let j = 0; j < enemyItems.length; j++) {
      const e = enemyItems[j];
      if (!e.active) continue;
      if (bm.hits(e.x, e.y, e.radius)) scene.damageEnemy(e, dmg, false);
    }
    if (boss && boss.active && boss.state === 'combat') {
      for (let k = 0; k < boss.parts.length; k++) {
        const p = boss.parts[k];
        if (bm.hits(p.x, p.y, p.radius)) scene.damageBoss(p, dmg);
      }
    }
  }

  // 3) 敌方子弹 × 玩家（判定小圆 + 擦弹环）
  const eb = pools.enemyBullet.items;
  const useGrid = pools.enemyBullet.activeCount > PHYS.gridThreshold;
  const grazeR2 = BALANCE.grazeRadius * BALANCE.grazeRadius;
  const hitR = player.radius;
  const hitR2 = hitR * hitR;

  function checkPlayerBullet(b) {
    if (!b.active || player.dead) return;
    const dx = b.x - player.x, dy = b.y - player.y;
    const d2 = dx * dx + dy * dy;
    if (d2 <= hitR2 + b.radius * b.radius) {
      scene.hurtPlayer();
      pools.enemyBullet.release(b);
      return;
    }
    if (!b.grazed && d2 <= grazeR2) {
      b.grazed = true;
      scene.onGraze(b);
    }
  }

  if (useGrid) {
    const grid = enemyBulletGrid;
    grid.clear();
    for (let i = 0; i < eb.length; i++) if (eb[i].active) grid.insert(eb[i]);
    grid.query(player.x, player.y, BALANCE.grazeRadius, _bQuery);
    for (let i = 0; i < _bQuery.length; i++) checkPlayerBullet(_bQuery[i]);
  } else {
    for (let i = 0; i < eb.length; i++) checkPlayerBullet(eb[i]);
  }

  // 4) 敌方激光 × 玩家
  for (let i = 0; i < beams.length; i++) {
    const bm = beams[i];
    if (!bm.active || bm.faction !== 'enemy') continue;
    if (bm.hits(player.x, player.y, player.radius) && bm.tickTimer <= 0) {
      bm.tickTimer = 0.35;
      scene.hurtPlayer();
    }
  }

  // 5) 敌机机身 × 玩家
  for (let i = 0; i < enemyItems.length; i++) {
    const e = enemyItems[i];
    if (!e.active || e.spawnDelay > 0 || player.dead) continue;
    const rr = e.radius + player.radius + 4;
    if ((e.x - player.x) * (e.x - player.x) + (e.y - player.y) * (e.y - player.y) > rr * rr) continue;
    scene.hurtPlayer();
    scene.damageEnemy(e, 9999, true);
  }

  // 6) Boss 机身 × 玩家
  if (boss && boss.active && boss.state === 'combat' && !player.dead) {
    const rr = boss.radius * 0.8 + player.radius;
    if ((boss.x - player.x) * (boss.x - player.x) + (boss.y - player.y) * (boss.y - player.y) <= rr * rr) {
      scene.hurtPlayer();
    }
  }

  // 7) 道具拾取
  const pk = pools.pickup.items;
  const magnetR = BALANCE.pickupMagnetRadius + player.magnetBonus;
  for (let i = 0; i < pk.length; i++) {
    const p = pk[i];
    if (!p.active || player.dead) continue;
    const rr = p.radius + 22;
    if ((p.x - player.x) * (p.x - player.x) + (p.y - player.y) * (p.y - player.y) <= rr * rr) {
      scene.collectPickup(p);
      pools.pickup.release(p);
    }
  }
}

/* ============================ 通用 UI 辅助 ============================ */
function inRect(x, y, r) {
  return input.pointer.x >= r.x && input.pointer.x <= r.x + r.w &&
    input.pointer.y >= r.y && input.pointer.y <= r.y + r.h;
}
function clicked(x, y, w, h) {
  return input.pointer.justDown && inRect(x, y, { x, y, w, h });
}
function hovered(x, y, w, h) {
  return inRect(x, y, { x, y, w, h });
}

function drawPanel(ctx, x, y, w, h, color, alpha) {
  ctx.fillStyle = 'rgba(6,10,20,' + (alpha === undefined ? 0.82 : alpha) + ')';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hexAlpha(color || THEME.neonCyan, 0.75);
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  // 四角装饰
  const c = 14;
  ctx.strokeStyle = color || THEME.neonCyan;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y + c); ctx.lineTo(x, y); ctx.lineTo(x + c, y);
  ctx.moveTo(x + w - c, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + c);
  ctx.moveTo(x + w, y + h - c); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - c, y + h);
  ctx.moveTo(x + c, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - c);
  ctx.stroke();
}

function drawButton(ctx, x, y, w, h, label, opts) {
  opts = opts || {};
  const hov = hovered(x, y, w, h);
  const color = opts.color || THEME.neonCyan;
  ctx.fillStyle = hov ? hexAlpha(color, 0.18) : 'rgba(8,14,26,0.8)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hov ? color : hexAlpha(color, 0.55);
  ctx.lineWidth = hov ? 3 : 2;
  if (hov) { ctx.shadowColor = color; ctx.shadowBlur = 14; }
  ctx.strokeRect(x, y, w, h);
  ctx.shadowBlur = 0;
  drawText(ctx, label, x + w / 2, y + h / 2 + 1, {
    size: opts.size || 24, color: hov ? '#FFFFFF' : hexAlpha(THEME.textPrimary, 0.9),
    glow: hov ? 12 : 0, glowColor: color
  });
  // silent：仅用于绘制（点击逻辑已由 clicked() 单独处理），避免重复触发音效
  if (!opts.silent && hov && input.pointer.justDown) { audio.play('uiSelect'); return true; }
  return false;
}

function drawToggle(ctx, x, y, w, h, label, on) {
  const hov = hovered(x, y, w, h);
  const color = on ? THEME.success : 'rgba(230,247,255,0.4)';
  ctx.fillStyle = 'rgba(8,14,26,0.8)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hov ? color : hexAlpha(color, 0.5);
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  drawText(ctx, label, x + 10, y + h / 2, { size: 15, color: THEME.textDim, align: 'left', mono: true });
  drawText(ctx, on ? 'ON' : 'OFF', x + w - 12, y + h / 2, {
    size: 16, color: on ? THEME.success : 'rgba(230,247,255,0.45)', align: 'right', mono: true
  });
  if (hov && input.pointer.justDown) { audio.play('uiMove'); return true; }
  return false;
}

        drawText(ctx, String(rows[r][1]), x + cw - 18, y + 246 + r * 24, {

        });
      }

      if (input.pointer.justDown && inRect(0, 0, { x, y, w: cw, h: ch })) this._start();
    }

    if (drawButton(ctx, (GAME_W - 300) / 2, 700, 300, 62, '出 击', { color: PLAYERS[this.sel].color, size: 26 })) this._start();
    if (drawButton(ctx, (GAME_W - 220) / 2, 790, 220, 50, '返回', { color: THEME.neonPurple, size: 20 })) {
      sceneManager.switchTo('menu');
    }

    drawScanlines(ctx);
    drawVignette(ctx);
  }
};

function drawMiniShip(ctx, p) {
  const w = p.size.w * 1.4, h = p.size.h * 1.4;
  ctx.beginPath();
  ctx.moveTo(0, -h * 0.5);
  ctx.lineTo(w * 0.22, -h * 0.05);
  ctx.lineTo(w * 0.5, h * 0.2);
  ctx.lineTo(w * 0.34, h * 0.38);
  ctx.lineTo(-w * 0.34, h * 0.38);
  ctx.lineTo(-w * 0.5, h * 0.2);
  ctx.lineTo(-w * 0.22, -h * 0.05);
  ctx.closePath();
  ctx.fillStyle = '#0E1A2C';
  ctx.fill();
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 16;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.moveTo(0, -h * 0.5);
  ctx.lineTo(w * 0.16, h * 0.16);
  ctx.lineTo(0, h * 0.3);
  ctx.lineTo(-w * 0.16, h * 0.16);
  ctx.closePath();
  ctx.fillStyle = hexAlpha(p.color, 0.85);
  ctx.fill();
}

/* ============================ 战斗场景 ============================ */
const BOSS_IDS = ['boss_guardian', 'boss_hydra', 'boss_fortress', 'boss_phantom', 'boss_overlord'];

const PlayScene = {
  /* —— 运行态 —— */
  pools: null,
  player: null,
  level: null,
  levelIdx: 0,
  mode: 'campaign',
  state: 'playing',
  stateT: 0,

  bossCtl: null,
  bossInfo: null,
  bossSpawned: false,
  bossCount: 0,
  waveCount: 0,
  combo: null,
  wingmen: [],
  floaters: [],
  particlesRef: null,
  score: 0,
  upgradedIds: [],
  shieldNovaCd: 0,
  buttons: [],
  pointerOnButton: false,
  paused: false,
  pauseSel: 0,
  upgradeChoices: null,
  stats: null,
  deathTimer: 0,
  clearTimer: 0,
  resultHandled: false,
  _vbtnBombPrev: false,
  _vbtnSkillPrev: false,
  _debugT: 0,

    p = p || {};
    this.mode = p.mode || 'campaign';
    this.levelIdx = p.levelIdx || 0;
    this.bossCount = p.bossCount || 0;
    this.waveCount = p.waveCount || 0;
    this.upgradedIds = [];
    this.paused = false;
    this.pauseSel = 0;
    this.floaters = [];
    this.score = p.score || 0;
    this.stats = { kills: 0, graze: 0, hits: 0, time: 0, maxCombo: 0 };
    this.combo = new ComboSystem();
    camera.reset();
    loop.resetTime();
    bg.speedMul = 1;

    if (p.newRun || !this.player) {
      this.player = new Player();
      this.player.reset(p.playerId || 'falcon');
      this.wingmen = [];
    }
    this._setupLevel();
  },

  exit() {
    if (this.player && this.player.beam) this.player.beam = null;
  },

  _setupLevel() {
    this.level = this.mode === 'endless' ? LEVELS[0] : LEVELS[clamp(this.levelIdx, 0, LEVELS.length - 1)];
    this.pools = createPools();
    this.particlesRef = this.pools.particle;
    this.player.beam = null;
    this.player.x = GAME_W / 2;
    this.player.y = GAME_H - 180;
    this.player.invuln = Math.max(this.player.invuln, 1.2);
    bg.setTheme(this.level.theme);
    bg.speedMul = 1;

    const n = this.mode === 'endless' ? 1 + this.waveCount * 0.5 : this.levelIdx + 1;
    this.spawner = new Spawner(this.level, {
      endless: this.mode === 'endless',
      hpMul: BALANCE.enemyHpMul(n),
      speedMul: BALANCE.enemySpeedMul(n),
      bulletSpeedMul: BALANCE.bulletSpeedMul(n),
      attackMul: 1
    });
    this.boss = null;
    this.bossCtl = null;
    this.bossInfo = null;
    this.bossSpawned = false;
    this.state = 'playing';
    this.stateT = 0;
    this.deathTimer = 0;
    this.clearTimer = 0;
    this.resultHandled = false;
    this.shieldNovaCd = 0;
    this.buttons = [
      { id: 'bomb', x: 88, y: GAME_H - 92, r: 48 },
      { id: 'nova', x: 196, y: GAME_H - 152, r: 34 },
      { id: 'skill', x: GAME_W - 88, y: GAME_H - 92, r: 48 },
      { id: 'pause', x: GAME_W - 40, y: 132, r: 26 }
    ];
    this.wingmen = [];
    this._syncWingmen();
  },

  buildCarryParams() {
    return {
      newRun: false,
      player: this.player,
      playerId: this.player.cfg.id,
      mode: this.mode,
      levelIdx: this.levelIdx,
      bossCount: this.bossCount,
      waveCount: this.waveCount,
      score: this.score
    };
  },

  /* —— 主更新 —— */
  update(dt) {
    bg.update(dt);
    camera.update(dt);
    audio.updateBgm(dt);

    if (input.wasPressed('KeyM')) {
      const s = storage.save.settings;
      s.sfx = !s.sfx;
      audio.setMuted(!s.sfx);
      storage.persist();
    }
    if (input.wasPressed('F3')) debug.toggle();

    // 暂停
    if (this.state !== 'gameover' && (input.wasPressed('Escape') || input.wasPressed('KeyP'))) {
      this.paused = !this.paused;
      audio.play('uiMove');
    }

    if (this.paused) { this._updatePause(dt); return; }

    // 虚拟按钮
    input.updateVirtualButtons(view.isTouch ? this.buttons : []);
    this.pointerOnButton = input.vbtn.bomb || input.vbtn.skill || input.vbtn.nova || input.vbtn.pause;
    if (view.isTouch && input.vbtnPressed('pause')) { this.paused = true; audio.play('uiMove'); }
    if (view.isTouch && input.vbtnPressed('bomb')) this._tryBomb();
    if (view.isTouch && input.vbtnPressed('skill')) this._trySlow();
    if (view.isTouch && input.vbtnPressed('nova')) this._tryNova();

    if (this.state === 'levelup') { this._updateLevelUp(dt); return; }

    if (this.state === 'clear') {
      this.stateT += dt;
      this._updateWorld(dt, true);
      if (this.stateT > 1.2) this._openLevelUp();
      return;
    }

    if (this.state === 'gameover') {
      this.deathTimer -= dt;
      this._updateWorld(dt, true);
      if (this.deathTimer <= 0 && !this.resultHandled) {
        this.resultHandled = true;
        this._writeResult(false);
      }
      return;
    }

    if (this.state === 'victory') {
      this.stateT += dt;
      this._updateWorld(dt, true);
      if (this.stateT > 1.4 && !this.resultHandled) {
        this.resultHandled = true;
        this._writeResult(true);
      }
      return;
    }

    // 键盘技能：空格清屏炸弹 / Shift 时间减速 / Q 护盾爆发
    if (input.wasPressed('Space')) this._tryBomb();
    if (input.wasPressed('ShiftLeft') || input.wasPressed('ShiftRight')) this._trySlow();
    if (input.wasPressed('KeyQ')) this._tryNova();

    this.stats.time += dt;

    // Boss 警告状态
    if (this.state === 'bossWarn') {
      this.stateT += dt;
      this._updateWorld(dt, true);
      if (this.stateT >= BALANCE.bossWarnTime + BALANCE.bossWarnDelay) this._spawnBoss();
      return;
    }

    this._updateWorld(dt, false);

    // 触发 Boss
    if (!this.bossSpawned && !this.boss && this.spawner.shouldSpawnBoss) {
      this.bossSpawned = true;
      if (this.spawner.clearEndlessBossPending) this.spawner.clearEndlessBossPending();
      this.state = 'bossWarn';
      this.stateT = 0;
      bg.speedMul = 1.35;
      audio.play('bossWarn');
      eventBus.emit(EV.BOSS_SPAWNED, {});
    }
  },

  _updateWorld(dt, frozenPlayer) {
    const player = this.player;

    if (!frozenPlayer) {
      const pointerControl = input.pointer.down && !this.pointerOnButton && !player.dead;
      player.update(dt, pointerControl);
      updateWeapon(player, this.pools, dt, this.pools.enemy, this.boss);
      updateWingmen(this.wingmen, player, this.pools, dt);
      this.spawner.update(dt, this.pools, player);
    }

    updateEnemyFire(this.pools, dt, player, this.spawner.opts.bulletSpeedMul);

    // 敌机移动
    const items = this.pools.enemy.items;
    for (let i = 0; i < items.length; i++) {
      const e = items[i];
      if (!e.active) continue;
      e.update(dt, player);
      if (e.offscreen()) this.pools.enemy.release(e);
    }

    // Boss
    if (this.boss && this.boss.active) {
      this.boss.update(dt);
      if (this.bossCtl) this.bossCtl.update(dt, this.pools, player, this.spawner.opts.bulletSpeedMul);
      this._updateBossInfo();
      if (this.boss.state === 'dying' && this.boss.dyingT <= 0) this._finishBoss();
    }

    // 子弹 / 激光 / 道具 / 粒子
    updateBullets(this.pools.playerBullet, dt, this.pools);
    updateBullets(this.pools.enemyBullet, dt, this.pools);
    updateBeams(this.pools.beam, dt);

    const pk = this.pools.pickup.items;
    const magnetR = BALANCE.pickupMagnetRadius + player.magnetBonus;
    for (let i = 0; i < pk.length; i++) {
      const p = pk[i];
      if (!p.active) continue;
      p.update(dt, player.dead ? null : player, magnetR);
      if (p.offscreen()) this.pools.pickup.release(p);
    }

    const pt = this.pools.particle.items;
    for (let i = 0; i < pt.length; i++) {
      const p = pt[i];
      if (!p.active) continue;
      p.update(dt);
      if (p.life <= 0) this.pools.particle.release(p);
    }

    if (!frozenPlayer) updateCollisions(this);

    this.combo.update(dt);
    if (this.combo.combo > this.stats.maxCombo) this.stats.maxCombo = this.combo.combo;
    if (this.shieldNovaCd > 0) this.shieldNovaCd -= dt;
    this._updateFloaters(dt);

    // 引擎拖尾
    if (player.alive && !player.dead && loop.frameCount % 2 === 0) {
      spawnTrail(this.pools.particle, player.x - 5, player.y + 22, player.color, 4);
    }
  },

  _updateFloaters(dt) {
    for (let i = this.floaters.length - 1; i >= 0; i--) {
      const f = this.floaters[i];
      f.life -= dt;
      f.y -= 42 * dt;
      if (f.life <= 0) this.floaters.splice(i, 1);
    }
  },

  _updateBossInfo() {
    if (!this.boss) { this.bossInfo = null; return; }
    if (!this.bossInfo) {
      this.bossInfo = {
        name: this.boss.name, phase: 1, phaseCount: this.boss.phaseCount,
        hpPct: 1, enrage: false,
        parts: this.boss.parts.map((p) => ({
          ox: p.ox, color: p.color, destroyed: p.destroyed, isWeakPoint: p.isWeakPoint
        }))
      };
    }
    this.bossInfo.phase = this.boss.phase;
    this.bossInfo.hpPct = this.boss.hpPct;
    this.bossInfo.enrage = this.boss.enrage;
    for (let i = 0; i < this.bossInfo.parts.length; i++) {
      this.bossInfo.parts[i].destroyed = this.boss.parts[i].destroyed;
    }
  },

  /* —— 敌机伤害与死亡 —— */
  damageEnemy(e, dmg, silent) {
    if (!e.active) return;
    if (!silent) audio.play('enemyHit');
    const killed = e.damage(dmg);
    if (killed) this.killEnemy(e);
  },

  killEnemy(e) {
    const mult = this.combo.multiplier;
    const gain = e.score * mult * this.player.scoreMul;
    this.addScore(gain, e.x, e.y, THEME.warnYellow, e.score >= 1000);
    spawnExplosion(this.pools.particle, e.x, e.y, e.cfg.color, clamp(e.radius / 22, 0.8, 2.2));
    audio.play(e.score >= 1000 ? 'bigExplosion' : 'explosion');
    this.combo.add(1);
    this.player.addEnergy(BALANCE.energyPerKill);
    this.stats.kills++;
    camera.shake(e.score >= 1000 ? 8 : 3, 0.16);
    spawnDrops(e, this.pools);

    // 分裂机死亡分裂
    if (e.cfg.onDeathSpawn) {
      const cfg = e.cfg.onDeathSpawn;
      for (let i = 0; i < cfg.count; i++) {
        const child = this.pools.enemy.acquire();
        if (!child) break;
        child.init(ENEMIES[cfg.id], e.x + (i - 1) * cfg.spread, e.y, {
          hpMul: 1, speedMul: 1.15, bulletSpeedMul: 1, dir: i % 2 === 0 ? -1 : 1, targetY: 200
        });
      }
    }
    this.pools.enemy.release(e);
    eventBus.emit(EV.ENEMY_KILLED, { x: e.x, y: e.y, score: gain });
  },

  areaDamage(x, y, radius, dmg) {
    const items = this.pools.enemy.items;
    for (let i = 0; i < items.length; i++) {
      const e = items[i];
      if (!e.active) continue;
      const dx = e.x - x, dy = e.y - y;
      if (dx * dx + dy * dy <= radius * radius) this.damageEnemy(e, dmg * 0.6, true);
    }
    spawnExplosion(this.pools.particle, x, y, THEME.warnYellow, 1.1);
    audio.play('explosion');
  },

  /* —— Boss 伤害 —— */
  damageBoss(part, dmg) {
    const boss = this.boss;
    if (!boss || !boss.active || boss.invuln || boss.state !== 'combat') return;
    let value = dmg;
    let killPart = false;

    if (part) {
      if (part.isWeakPoint) {
        const exposed = boss.coreExposed;
        value = dmg * part.weakPointMul * (exposed ? 1.5 : 0.7);
      } else if (!part.destroyed) {
        killPart = boss.damagePart(part, dmg);
        value = dmg * 0.5;
        if (killPart) {
          spawnExplosion(this.pools.particle, part.x, part.y, part.color, 2.2);
          spawnRing(this.pools.particle, part.x, part.y, part.color, 140);
          audio.play('bigExplosion');
          camera.shake(12, 0.35);
          this.addScore(part.def.score, part.x, part.y, part.color, true);
        }
      } else {
        value = dmg * 0.45;
      }
    } else {
      value = dmg * (boss.coreExposed ? 0.8 : 0.45);
    }

    const res = boss.damage(value);
    audio.play('enemyHit');
    if (res === 'phase') this._startPhaseTransition();
    else if (res === 'dead') this._onBossDown();
  },

  _startPhaseTransition() {
    const boss = this.boss;
    boss.state = 'transition';
    boss.stateT = 0;
    boss.invuln = true;
    audio.play('bossPhaseShift');
    camera.flashScreen(THEME.neonMagenta, 0.5);
    camera.shake(20, 0.7);
    loop.setTimeScale(0.4, 1.2);
    // 清空全场敌弹
    const eb = this.pools.enemyBullet.items;
    for (let i = 0; i < eb.length; i++) {
      if (eb[i].active) {
        spawnTrail(this.pools.particle, eb[i].x, eb[i].y, THEME.neonCyan, 5);
        this.pools.enemyBullet.release(eb[i]);
      }
    }
    for (let i = 0; i < 3; i++) spawnRing(this.pools.particle, boss.x, boss.y, THEME.neonCyan, 260 + i * 120);
    eventBus.emit(EV.BOSS_PHASE_CHANGED, { bossId: boss.id, phase: boss.phase + 1 });
  },

  _onBossDown() {
    const boss = this.boss;
    audio.play('bossDown');
    camera.flashScreen('#FFFFFF', 0.85);
    camera.shake(26, 1.2);
    loop.setTimeScale(0.35, 2.0);
    this.addScore(boss.score * this.combo.multiplier * this.player.scoreMul, boss.x, boss.y - 60, THEME.warnYellow, true);
    this.combo.add(5);
    eventBus.emit(EV.BOSS_DEFEATED, { bossId: boss.id });
  },

  _finishBoss() {
    const boss = this.boss;
    if (!boss || boss.state === 'done') return;
    boss.state = 'done';
    // 连续爆炸
    for (let i = 0; i < boss.cfg.deathSequence.explosionCount; i++) {
      const x = boss.x + randRange(-boss.radius, boss.radius);
      const y = boss.y + randRange(-boss.radius * 0.7, boss.radius * 0.7);
      spawnExplosion(this.pools.particle, x, y, i % 3 === 0 ? '#FFFFFF' : THEME.warnYellow, 1.8);
    }
    spawnRing(this.pools.particle, boss.x, boss.y, '#FFFFFF', 520);
    camera.flashScreen('#FFFFFF', 1.0);
    camera.shake(30, 1.0);
    audio.play('bigExplosion');
    this.pools.beam.releaseAll();
    // 掉奖励
    for (let i = 0; i < 3; i++) {
      const p = this.pools.pickup.acquire();
      if (!p) break;
      const kind = i === 0 ? 'P' : (i === 1 ? 'B' : (Math.random() < 0.5 ? 'S' : 'E'));
      p.init(kind, boss.x + (i - 1) * 60, boss.y, DROPS[kind]);
    }
    this.boss.active = false;
    this.boss = null;
    this.bossInfo = null;
    this.bossCtl = null;
    this.state = 'clear';
    this.stateT = 0;
    bg.speedMul = 1;
  },

  _spawnBoss() {
    let bossId;
    if (this.mode === 'endless') bossId = BOSS_IDS[this.bossCount % BOSS_IDS.length];
    else bossId = this.level.bossId;
    const boss = new Boss();
    const n = this.mode === 'endless' ? 1 + this.bossCount * 0.8 : this.levelIdx + 1;
    boss.init(BOSSES[bossId], {
      hpMul: this.mode === 'endless' ? BALANCE.endlessWaveHpMul(this.bossCount * 2 + 1) : BALANCE.enemyHpMul(n) * 0.9,
      bulletSpeedMul: BALANCE.bulletSpeedMul(n)
    });
    this.boss = boss;
    this.bossCtl = new BossController(boss);
    this.bossInfo = null;
    this.state = 'playing';
    this.stateT = 0;
    // 清空现存敌机
    const items = this.pools.enemy.items;
    for (let i = 0; i < items.length; i++) if (items[i].active) this.pools.enemy.release(items[i]);
  },

  /* —— 玩家受伤 / 擦弹 —— */
  hurtPlayer() {
    const player = this.player;
    if (player.dead) return;
    const r = player.hit();
    if (r === 'none') return;
    this.stats.hits++;
    if (r === 'shield') {
      audio.play('shieldBreak');
      camera.shake(12, 0.32);
      camera.flashScreen(THEME.neonPurple, 0.35);
      spawnRing(this.pools.particle, player.x, player.y, THEME.neonPurple, 180);
    } else {
      audio.play('playerHit');
      camera.shake(20, 0.55);
      camera.flashScreen(THEME.dangerRed, 0.5);
      spawnExplosion(this.pools.particle, player.x, player.y, THEME.dangerRed, 1.6);
      this.combo.reset();
      if (player.hp <= 0) this._killPlayer();
    }
  },

  _killPlayer() {
    const player = this.player;
    player.dead = true;
    spawnExplosion(this.pools.particle, player.x, player.y, player.color, 3.2);
    spawnExplosion(this.pools.particle, player.x, player.y, '#FFFFFF', 2.2);
    spawnRing(this.pools.particle, player.x, player.y, '#FFFFFF', 420);
    camera.shake(34, 1.4);
    camera.flashScreen('#FFFFFF', 0.9);
    audio.play('bigExplosion');
    loop.setTimeScale(0.35, 1.6);
    this.state = 'gameover';
    this.deathTimer = 2.4;
  },

  onGraze(b) {
    const player = this.player;
    player.grazeCount++;
    player.grazeTotal++;
    this.stats.graze++;
    player.addEnergy(BALANCE.energyPerGraze);
    const bonus = player.special === 'grazeBonus' ? 1.5 : 1;
    const gain = BALANCE.grazeScore * this.combo.multiplier * bonus * player.scoreMul;
    this.score += gain;
    spawnTrail(this.pools.particle, b.x, b.y, THEME.neonCyan, 6);
    audio.play('graze');
    if (player.grazeShieldOn && player.grazeCount >= 60) {
      player.grazeCount = 0;
      if (player.shield < BALANCE.shieldMax) {
        player.shield++;
        spawnRing(this.pools.particle, player.x, player.y, THEME.neonPurple, 150);
        audio.play('pickupBig');
      }
    }
  },

  collectPickup(p) {
    const player = this.player;
    const kind = p.kind;
    if (kind === 'P') {
      if (player.power < BALANCE.powerMax) {
        player.power++;
        player.weaponLevel = player.power;
        this.addScore(0, p.x, p.y, THEME.neonCyan, false, true);
        audio.play('pickup');
      } else {
        this.addScore(500, p.x, p.y, THEME.neonCyan, false);
        audio.play('pickup');
      }
    } else if (kind === 'W') {
      const ids = Object.keys(WEAPONS).filter((k) => k !== player.weaponId);
      player.weaponId = pick(ids);
      player.power = 1;
      player.addEnergy(BALANCE.energyPerPickup);
      audio.play('pickupBig');
      this.addFloater(WEAPONS[player.weaponId].name, player.x, player.y - 40, WEAPONS[player.weaponId].color, 22);
    } else if (kind === 'B') {
      player.bombs = Math.min(player.bombMax, player.bombs + 1);
      audio.play('pickup');
    } else if (kind === 'S') {
      player.shield = Math.min(BALANCE.shieldMax, player.shield + 1);
      audio.play('pickupBig');
    } else if (kind === '1UP') {
      player.hp = Math.min(player.hpMax, player.hp + 1);
      audio.play('pickupBig');
      this.addFloater('1UP', player.x, player.y - 40, THEME.success, 26);
    } else if (kind === 'E') {
      player.addEnergy(BALANCE.energyPerPickup);
      audio.play('pickup');
    } else if (kind === 'C') {
      this.addScore(300, p.x, p.y, '#FCD34D', false);
      audio.play('pickup');
    }
    spawnRing(this.pools.particle, p.x, p.y, p.cfg.color, 70);
    eventBus.emit(EV.PICKUP_COLLECTED, { kind });
  },

  /* —— 技能 —— */
  _tryBomb() {
    if (this.state !== 'playing' && this.state !== 'bossWarn') return;
    if (useBomb(this)) this.addFloater('BOMB!', this.player.x, this.player.y - 70, THEME.warnYellow, 30);
  },
  _trySlow() {
    if (this.state !== 'playing' && this.state !== 'bossWarn') return;
    if (useSlow(this)) { audio.play('slow'); this.addFloater('TIME SLOW', this.player.x, this.player.y - 70, THEME.neonCyan, 24); }
  },
  _tryNova() {
    if (this.state !== 'playing' && this.state !== 'bossWarn') return;
    if (useShieldNova(this)) this.addFloater('SHIELD NOVA', this.player.x, this.player.y - 70, THEME.neonPurple, 24);
  },

  slowMo(duration, scale) {
    loop.setTimeScale(scale, duration);
  },

  /* —— 分数与飘字 —— */
  addScore(v, x, y, color, big, silent) {
    if (v > 0) this.score += v;
    if (!silent && v > 0 && (big || v >= 100)) {
      this.addFloater('+' + Math.round(v), x, y, color || THEME.warnYellow, big ? 26 : 17);
    }
  },
  addFloater(text, x, y, color, size) {
    if (this.floaters.length > 24) this.floaters.shift();
    this.floaters.push({ text, x, y, color, size: size || 18, life: 0.9 });
  },

  /* —— 关卡结算与升级 —— */
  _openLevelUp() {
    this.state = 'levelup';
    this.stateT = 0;
    this.upgradeSel = 0;
    const pool = UPGRADES.filter((u) => !u.once || !this.upgradedIds.includes(u.id));
    const choices = [];
    const copy = pool.slice();
    for (let i = 0; i < 3 && copy.length > 0; i++) {
      choices.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    }
    this.upgradeChoices = choices;
    audio.play('uiSelect');
  },

  _applyUpgrade(u) {
    if (!u) {
      this.score += 800;
      audio.play('pickup');
    } else {
      u.apply(this.player);
      this.upgradedIds.push(u.id);
      audio.play('pickupBig');
      // 僚机
      if (u.id === 'wingmanAdd') this._syncWingmen();
    }
    this._advanceLevel();
  },

  _syncWingmen() {
    const want = this.player.wingmanMax;
    while (this.wingmen.length < want) {
      const w = this.pools.wingman.acquire();
      if (!w) break;
      const side = this.wingmen.length === 0 ? -1 : 1;
      w.init(side, this.player.color, 1);
      w.x = this.player.x + side * 56;
      w.y = this.player.y + 26;
      this.wingmen.push(w);
    }
  },

  _advanceLevel() {
    if (this.mode === 'endless') {
      this.bossCount++;
      this.waveCount++;
      this._setupLevel();
      return;
    }
    this.levelIdx++;
    if (this.levelIdx >= LEVELS.length) {
      this.state = 'victory';
      this.stateT = 0;
      audio.play('comboUp');
      return;
    }
    this._setupLevel();
  },

  _updateLevelUp(dt) {
    this.stateT += dt;
    bg.update(dt * 0.4);
    const choices = this.upgradeChoices || [];
    const cw = 420, ch = 120;
    for (let i = 0; i < choices.length; i++) {
      const x = (GAME_W - cw) / 2;
      const y = 470 + i * 140;
      if (clicked(x, y, cw, ch)) this._applyUpgrade(choices[i]);
      if (input.wasPressed('Digit' + (i + 1)) || input.wasPressed('Numpad' + (i + 1))) this._applyUpgrade(choices[i]);
    }
    if (clicked((GAME_W - 300) / 2, 470 + choices.length * 140 + 30, 300, 56)) this._applyUpgrade(null);
    if (input.wasPressed('KeyH')) this._applyUpgrade(null);
  },

  _updatePause(dt) {
    const items = ['继续游戏', '重新开始本关', '返回主菜单'];
    const bw = 380, bh = 62;
    for (let i = 0; i < items.length; i++) {
      const x = (GAME_W - bw) / 2;
      const y = 520 + i * 82;
      const hov = hovered(x, y, bw, bh);
      if (hov) this.pauseSel = i;
      if (input.pointer.justDown && inRect(0, 0, { x, y, w: bw, h: bh })) this._pauseAction(i);
    }
    if (input.wasPressed('ArrowUp') || input.wasPressed('KeyW')) this.pauseSel = (this.pauseSel + 2) % 3;
    if (input.wasPressed('ArrowDown') || input.wasPressed('KeyS')) this.pauseSel = (this.pauseSel + 1) % 3;
    if (input.wasPressed('Enter')) this._pauseAction(this.pauseSel);
  },

  _pauseAction(i) {
    audio.play('uiSelect');
    if (i === 0) this.paused = false;
    else if (i === 1) {
      this.paused = false;
      this.enter({ newRun: true, playerId: this.player.cfg.id, mode: this.mode, levelIdx: this.levelIdx });
    } else sceneManager.switchTo('menu');
  },

  _writeResult(win) {
    const s = storage.load();
    if (this.score > s.bestScore) s.bestScore = this.score;
    if (this.stats.maxCombo > s.bestCombo) s.bestCombo = this.stats.maxCombo;
    s.totalGraze += this.stats.graze;
    s.totalKills += this.stats.kills;
    if (win && this.mode === 'campaign') s.clearedLevels = Math.max(s.clearedLevels, LEVELS.length);
    if (this.mode === 'endless' && this.bossCount > s.endlessBest) s.endlessBest = this.bossCount;
    storage.persist();
    const rankPos = storage.addRank({
      score: Math.round(this.score),
      combo: this.stats.maxCombo,
      graze: this.stats.graze,
      kills: this.stats.kills,
      playerId: this.player.cfg.id,
      mode: this.mode,
      date: new Date().toISOString().slice(0, 10)
    });
    sceneManager.switchTo('gameover', {
      win, score: Math.round(this.score), stats: this.stats,
      mode: this.mode, player: this.player, rankPos, levelIdx: this.levelIdx
    });
  },

  /* —— 渲染 —— */
  render(ctx) {
    ctx.save();
    camera.apply(ctx);
    bg.render(ctx);

    // 道具
    const pk = this.pools.pickup.items;
    for (let i = 0; i < pk.length; i++) if (pk[i].active) pk[i].render(ctx);

    // 敌机
    const items = this.pools.enemy.items;
    for (let i = 0; i < items.length; i++) if (items[i].active) items[i].render(ctx);

    // 僚机
    for (let i = 0; i < this.wingmen.length; i++) if (this.wingmen[i].active) this.wingmen[i].render(ctx);

    // 玩家
    if (this.player.alive && !this.player.dead) this.player.render(ctx);

    // 子弹
    const pb = this.pools.playerBullet.items;
    for (let i = 0; i < pb.length; i++) if (pb[i].active) pb[i].render(ctx);
    const eb = this.pools.enemyBullet.items;
    for (let i = 0; i < eb.length; i++) if (eb[i].active) eb[i].render(ctx);

    // 激光
    const bm = this.pools.beam.items;
    for (let i = 0; i < bm.length; i++) if (bm[i].active) bm[i].render(ctx);

    // Boss
    if (this.boss && this.boss.active) this.boss.render(ctx);

    // 粒子
    const pt = this.pools.particle.items;
    for (let i = 0; i < pt.length; i++) if (pt[i].active) pt[i].render(ctx);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    ctx.restore();

    // HUD
    hud.render(ctx, {
      score: this.score,
      best: storage.save.bestScore,
      hp: this.player.hp, hpMax: this.player.hpMax,
      shield: this.player.shield,
      bombs: this.player.bombs,
      power: this.player.power,
      energy: this.player.energy,
      combo: this.combo.combo,
      comboTimer: this.combo.timer,
      comboWindow: BALANCE.comboWindow,
      multiplier: this.combo.multiplier,
      boss: this.boss ? this.bossInfo : null,
      floaters: this.floaters
    });

    // 低血警示
    if (this.player.hp <= 1 && !this.player.dead) {
      drawLowHpWarning(ctx, 0.10 + 0.08 * Math.sin(loop.frameCount * 0.1));
    }

    // 虚拟按钮
    if (view.isTouch) {
      this._renderVirtualButtons(ctx);
    }

    // Boss 警告
    if (this.state === 'bossWarn') {
      const prog = clamp(this.stateT / (BALANCE.bossWarnTime + BALANCE.bossWarnDelay), 0, 1);
      const bossCfg = BOSSES[this.mode === 'endless' ? BOSS_IDS[this.bossCount % BOSS_IDS.length] : this.level.bossId];
      drawBossWarning(ctx, prog, bossCfg.name, bossCfg.title);
    }

    // 关卡完成
    if (this.state === 'clear') {
      drawText(ctx, 'BOSS 击破', GAME_W / 2, GAME_H * 0.4, {
        size: 54, color: THEME.warnYellow, glow: 26, stroke: true, strokeWidth: 6
      });
      drawText(ctx, '地区肃清完成', GAME_W / 2, GAME_H * 0.4 + 56, {
        size: 22, color: THEME.textPrimary
      });
    }

    if (this.state === 'levelup') this._renderLevelUp(ctx);
    if (this.state === 'gameover') {
      drawText(ctx, 'MISSION FAILED', GAME_W / 2, GAME_H * 0.38, {
        size: 50, color: THEME.dangerRed, glow: 26, stroke: true, strokeWidth: 6
      });
    }
    if (this.state === 'victory') {
      drawText(ctx, 'ALL CLEAR', GAME_W / 2, GAME_H * 0.38, {
        size: 58, color: THEME.success, glow: 28, stroke: true, strokeWidth: 6
      });
      drawText(ctx, '全区域已肃清', GAME_W / 2, GAME_H * 0.38 + 60, { size: 24, color: THEME.textPrimary });
    }

    if (this.paused) this._renderPause(ctx);

    // 全屏后处理
    drawScreenTint(ctx);
    drawScanlines(ctx);
    drawVignette(ctx);

    if (debug.show) {
      drawText(ctx, 'FPS ' + loop.fps + '  EB ' + this.pools.enemyBullet.activeCount +
        '  PB ' + this.pools.playerBullet.activeCount + '  PT ' + this.pools.particle.activeCount,
        14, GAME_H - 16, { size: 13, color: THEME.success, align: 'left', mono: true });
    }
  },

  _renderVirtualButtons(ctx) {
    for (let i = 0; i < this.buttons.length; i++) {
      const b = this.buttons[i];
      const active = input.vbtn[b.id];
      const color = b.id === 'bomb' ? THEME.warnYellow : (b.id === 'skill' ? THEME.neonCyan : THEME.neonPurple);
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fillStyle = active ? hexAlpha(color, 0.35) : 'rgba(6,10,20,0.28)';
      ctx.fill();
      ctx.strokeStyle = hexAlpha(color, active ? 0.95 : 0.4);
      ctx.lineWidth = 2;
      ctx.stroke();
      const label = b.id === 'bomb' ? 'BOMB' : (b.id === 'skill' ? (this.player.energy >= 50 ? 'SLOW' : '—') : '❚❚');
      drawText(ctx, label, b.x, b.y, { size: 15, color: hexAlpha(color, 0.9), mono: true });
    }
  },

  _renderLevelUp(ctx) {
    ctx.fillStyle = 'rgba(3,5,12,0.82)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    drawText(ctx, '系 统 升 级', GAME_W / 2, 300, { size: 44, color: THEME.neonCyan, glow: 22 });
    drawText(ctx, '选择一项强化（按 1 / 2 / 3，或点击卡片；H 跳过换 800 分）', GAME_W / 2, 356, {
      size: 15, color: THEME.textDim
    });
    const choices = this.upgradeChoices || [];
    const cw = 420, ch = 120;
    for (let i = 0; i < choices.length; i++) {
      const u = choices[i];
      const x = (GAME_W - cw) / 2;
      const y = 470 + i * 140;
      const hov = hovered(x, y, cw, ch);
      ctx.fillStyle = hov ? hexAlpha(u.color, 0.2) : 'rgba(8,14,26,0.9)';
      ctx.fillRect(x, y, cw, ch);
      ctx.strokeStyle = u.color;
      ctx.lineWidth = hov ? 3 : 2;
      if (hov) { ctx.shadowColor = u.color; ctx.shadowBlur = 16; }
      ctx.strokeRect(x, y, cw, ch);
      ctx.shadowBlur = 0;
      drawText(ctx, String(i + 1), x + 34, y + ch / 2, { size: 30, color: hexAlpha(u.color, 0.9), mono: true });
      drawText(ctx, u.name, x + 76, y + 42, { size: 25, color: '#FFFFFF', align: 'left', glow: 8, glowColor: u.color });
      drawText(ctx, u.desc, x + 76, y + 78, { size: 15, color: THEME.textDim, align: 'left' });
    }
    drawButton(ctx, (GAME_W - 300) / 2, 470 + choices.length * 140 + 30, 300, 56, '跳过（+800 分）', {
      color: THEME.neonPurple, size: 18, silent: true
    });
  },

  _renderPause(ctx) {
    ctx.fillStyle = 'rgba(3,5,12,0.78)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    drawPanel(ctx, (GAME_W - 460) / 2, 380, 460, 420, THEME.neonCyan, 0.9);
    drawText(ctx, '暂 停', GAME_W / 2, 440, { size: 40, color: THEME.neonCyan, glow: 20 });
    const items = ['继续游戏', '重新开始本关', '返回主菜单'];
    const bw = 380, bh = 62;
    for (let i = 0; i < items.length; i++) {
      const x = (GAME_W - bw) / 2;
      const y = 520 + i * 82;
      const hov = hovered(x, y, bw, bh) || this.pauseSel === i;
      ctx.fillStyle = hov ? hexAlpha(THEME.neonCyan, 0.18) : 'rgba(8,14,26,0.8)';
      ctx.fillRect(x, y, bw, bh);
      ctx.strokeStyle = hov ? THEME.neonCyan : 'rgba(0,240,255,0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, bw, bh);
      drawText(ctx, items[i], GAME_W / 2, y + bh / 2 + 1, { size: 24, color: THEME.textPrimary });
    }
    drawText(ctx, '按 Esc / P 继续', GAME_W / 2, 780, { size: 15, color: THEME.textDim, mono: true });
  }
};

/* ============================ 结算 ============================ */
const GameOverScene = {
  data: null,
  enter(p) {
    this.data = p || {};
    this.t = 0;
    camera.reset();
    loop.resetTime();
  },
  update(dt) {
    this.t += dt;
    bg.update(dt * 0.6);
    if ((input.wasPressed('Enter') || input.wasPressed('Space')) && this.t > 0.8) this._restart();
    if (input.wasPressed('Escape')) sceneManager.switchTo('menu');
  },
  _restart() {
    audio.play('uiSelect');
    const p = this.data;
    sceneManager.switchTo('play', {
      newRun: true,
      playerId: p.player ? p.player.cfg.id : 'falcon',
      mode: p.mode || 'campaign',
      levelIdx: 0
    });
  },
  render(ctx) {
    bg.render(ctx);
    ctx.fillStyle = 'rgba(3,5,12,0.62)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    const d = this.data;
    const win = d.win;
    drawText(ctx, win ? 'ALL CLEAR' : 'MISSION FAILED', GAME_W / 2, 200, {
      size: 54, color: win ? THEME.success : THEME.dangerRed, glow: 28, stroke: true, strokeWidth: 6
    });
    drawPanel(ctx, 90, 280, GAME_W - 180, 420, win ? THEME.success : THEME.neonCyan, 0.9);
    drawText(ctx, formatScore(d.score), GAME_W / 2, 360, {
      size: 52, color: THEME.warnYellow, mono: true, glow: 18
    });
    drawText(ctx, 'SCORE', GAME_W / 2, 404, { size: 14, color: THEME.textDim, mono: true });

    const st = d.stats || {};
    const rows = [
      ['最高连击', st.maxCombo || 0],
      ['擦弹次数', st.graze || 0],
      ['击坠数', st.kills || 0],
      ['受击次数', st.hits || 0],
      ['用时', Math.floor(st.time || 0) + 's']
    ];
    for (let i = 0; i < rows.length; i++) {
      const y = 460 + i * 40;
      drawText(ctx, rows[i][0], 150, y, { size: 18, color: THEME.textDim, align: 'left' });
      drawText(ctx, String(rows[i][1]), GAME_W - 150, y, {
        size: 20, color: THEME.textPrimary, align: 'right', mono: true
      });
    }
    if (d.rankPos >= 0) {
      drawText(ctx, '★ 排行榜第 ' + (d.rankPos + 1) + ' 名 ★', GAME_W / 2, 664, {
        size: 20, color: THEME.warnYellow, glow: 12
      });
    }

    if (drawButton(ctx, (GAME_W - 300) / 2, 760, 300, 62, '再 来 一 局', { size: 24 })) this._restart();
    if (drawButton(ctx, (GAME_W - 300) / 2, 840, 300, 56, '排行榜', { color: THEME.neonPurple, size: 20 })) {
      sceneManager.switchTo('ranking');
    }
    if (drawButton(ctx, (GAME_W - 300) / 2, 912, 300, 56, '主菜单', { color: THEME.neonMagenta, size: 20 })) {
      sceneManager.switchTo('menu');
    }

    drawScanlines(ctx);
    drawVignette(ctx);
  }
};

/* ============================ 排行榜 ============================ */
const RankingScene = {
  enter() { bg.setTheme('station'); },
  update(dt) {
    bg.update(dt);
    if (input.wasPressed('Escape') || input.wasPressed('Enter') || input.wasPressed('Space')) sceneManager.switchTo('menu');
  },
  render(ctx) {
    bg.render(ctx);
    drawPanel(ctx, 70, 160, GAME_W - 140, 800, THEME.warnYellow, 0.9);
    drawText(ctx, '排 行 榜', GAME_W / 2, 220, { size: 38, color: THEME.warnYellow, glow: 20 });
    drawText(ctx, 'TOP 10', GAME_W / 2, 262, { size: 15, color: THEME.textDim, mono: true });
    const list = storage.getRank();
    if (list.length === 0) {
      drawText(ctx, '暂无记录，快去创造你的战绩吧', GAME_W / 2, 520, { size: 20, color: THEME.textDim });
    }
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      const y = 310 + i * 62;
      const color = i === 0 ? THEME.warnYellow : (i === 1 ? '#C4B5FD' : (i === 2 ? '#FF9BD2' : THEME.textPrimary));
      drawText(ctx, '#' + (i + 1), 120, y, { size: 20, color, align: 'left', mono: true });
      drawText(ctx, formatScore(e.score), 210, y, { size: 24, color, align: 'left', mono: true });
      drawText(ctx, (e.mode === 'endless' ? '无尽' : '战役'), 470, y, { size: 14, color: THEME.textDim, mono: true });
      drawText(ctx, 'x' + (e.combo || 0), 560, y, { size: 14, color: THEME.textDim, mono: true });
      drawText(ctx, (e.date || '').slice(5), GAME_W - 110, y, { size: 13, color: THEME.textDim, align: 'right', mono: true });
    }
    if (drawButton(ctx, (GAME_W - 260) / 2, 1000, 260, 58, '返 回', { size: 22 })) sceneManager.switchTo('menu');
    drawScanlines(ctx);
    drawVignette(ctx);
  }
};

/* ===================== main.js ===================== */
/**
 * 星际突围 STAR BREAKER —— 入口
 * 引导画布 / 输入 / 背景 / 存档 / 场景注册 / 主循环
 */

/* ---------- 画布 & 输入 ---------- */
const canvas = document.getElementById('game');
if (!canvas) throw new Error('缺少 <canvas id="game">');

initView(canvas);
input.setup(canvas);
bg.init();

/* ---------- 存档 & 音频偏好 ---------- */
const save = storage.load();
audio.setBgm(save.settings.bgm);
audio.setMuted(!save.settings.sfx);

// 首次交互时解锁 AudioContext（浏览器自动播放策略）
const unlock = () => { audio.init(); };
window.addEventListener('pointerdown', unlock, { once: true });
window.addEventListener('keydown', unlock, { once: true });

/* ---------- 场景注册 ---------- */
sceneManager.register('boot', BootScene);
sceneManager.register('menu', MenuScene);
sceneManager.register('select', SelectScene);
sceneManager.register('play', PlayScene);
sceneManager.register('gameover', GameOverScene);
sceneManager.register('ranking', RankingScene);
sceneManager.switchTo('boot');

/* ---------- 横屏提示 ---------- */
function renderLandscapeHint(ctx) {
  if (!view.landscape) return;
  ctx.fillStyle = 'rgba(3,4,10,0.9)';
  ctx.fillRect(0, 0, GAME_W, GAME_H);
  drawText(ctx, '请 竖 屏 游 玩', GAME_W / 2, GAME_H / 2 - 20, {
    size: 40, color: THEME.neonCyan, glow: 20
  });
  drawText(ctx, '将手机旋转为竖屏 / 或拉高浏览器窗口', GAME_W / 2, GAME_H / 2 + 50, {
    size: 18, color: THEME.textDim
  });
}

/* ---------- 主循环 ---------- */
function update(dt) {
  sceneManager.update(dt);
}

function render() {
  const ctx = view.ctx;
  beginFrame(ctx);          // 逻辑坐标 720×1280

  ctx.save();
  camera.apply(ctx);        // 震屏
  sceneManager.render(ctx);
  ctx.restore();

  renderLandscapeHint(ctx);
}

loop.start(update, render);

/* ---------- 全局快捷键 ---------- */
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyM') {
    const s = storage.save.settings;
    s.sfx = !s.sfx;
    audio.setMuted(!s.sfx);
    storage.persist();
  }
});

/* ---------- 离开页面时暂停（避免切后台继续推进） ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) loop.resetTime();
});

// 便于调试：window.SB.PlayScene 等
window.SB = { sceneManager, loop, view, input, storage, audio, bg, hexAlpha };

})();
  </script>
