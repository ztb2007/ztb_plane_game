// 核心基础设施：数学工具 / 随机数 / 事件总线 / 对象池 / 存档 / 音频合成

/* ============================ 数学工具 ============================ */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function randRange(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); }
function dist2(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; }
function angleTo(x1, y1, x2, y2) { return Math.atan2(y2 - y1, x2 - x1); }
function approach(cur, target, delta) {
  if (cur < target) return Math.min(cur + delta, target);
  return Math.max(cur - delta, target);
}
function formatScore(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ============================ 可复现随机数 ============================ */
function createRng(seed) {
  let s = (seed >>> 0) || 1;
  function next() {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    next,
    range: (a, b) => a + next() * (b - a),
    int: (a, b) => Math.floor(a + next() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(next() * arr.length)]
  };
}

  off(name, fn) {
    const list = this._map[name];
    if (!list) return;
    const i = list.indexOf(fn);
    if (i >= 0) list.splice(i, 1);
  },
  emit(name, payload) {
    const list = this._map[name];
    if (!list) return;
    for (let i = 0; i < list.length; i++) list[i](payload);
  },
  clear() { this._map = {}; }
};

/* ============================ 对象池 ============================ */
class Pool {
  constructor(size, factory) {
    this.items = new Array(size);
    this.freeIdx = new Array(size);
    for (let i = 0; i < size; i++) {
      const o = factory();
      o.active = false;
      o._pi = i;
      this.items[i] = o;
      this.freeIdx[size - 1 - i] = i;
    }
    this.activeCount = 0;
    this.size = size;
  }
  acquire() {
    if (this.freeIdx.length === 0) return null; // 取不到就丢弃，保证帧率稳定
    const i = this.freeIdx.pop();
    const o = this.items[i];
    o.active = true;
    this.activeCount++;
    return o;
  }
  release(o) {
    if (!o || !o.active) return;
    o.active = false;
    this.activeCount--;
    this.freeIdx.push(o._pi);
  }
  releaseAll() {
    this.freeIdx.length = 0;
    for (let i = 0; i < this.size; i++) {
      this.items[i].active = false;
      this.freeIdx[this.size - 1 - i] = i;
    }
    this.activeCount = 0;
  }
}

const KEY_SAVE = 'starbreaker_save_v1';
const KEY_RANK = 'starbreaker_rank_v1';

const DEFAULT_SAVE = {
  version: 1,
  bestScore: 0,

  totalKills: 0,

  endlessBest: 0,
  settings: { bgm: true, sfx: true, showHitbox: true, quality: 'high' }
};

function safeRead(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed || fallback;
  } catch (e) {
    return fallback;
  }
}
function safeWrite(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 隐私模式下忽略 */ }
}

const storage = {
  save: null,
  load() {
    const s = safeRead(KEY_SAVE, null);
    this.save = Object.assign({}, DEFAULT_SAVE, s || {});
    this.save.settings = Object.assign({}, DEFAULT_SAVE.settings, (s && s.settings) || {});
    return this.save;
  },
  persist() { safeWrite(KEY_SAVE, this.save); },
  getRank() { return safeRead(KEY_RANK, []); },
  addRank(entry) {
    const list = this.getRank();
    list.push(entry);
    list.sort((a, b) => b.score - a.score);
    const top = list.slice(0, 10);
    safeWrite(KEY_RANK, top);
    return top.findIndex((e) => e === entry);
  }
};

/* ============================ 音频（Web Audio 实时合成，零音频文件） ============================ */
let actx = null;
let master = null;
let bgmGain = null;
let noiseBuf = null;
let mutedAll = false;
let bgmEnabled = true;
const lastPlay = {};

function ensureAudio() {
  if (actx) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = mutedAll ? 0 : 0.5;
  master.connect(actx.destination);
  bgmGain = actx.createGain();
  bgmGain.gain.value = 0.16;
  bgmGain.connect(master);
  const len = Math.floor(actx.sampleRate * 0.8);
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return true;
}

function tone(f0, f1, dur, type, gain, dest, delay) {
  const t0 = actx.currentTime + (delay || 0);
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(Math.max(1, f0), t0);
  if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g);
  g.connect(dest || master);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}

function noiseHit(dur, f0, f1, gain, q) {
  const t0 = actx.currentTime;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;
  const filt = actx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.Q.value = q || 1;
  filt.frequency.setValueAtTime(Math.max(20, f0), t0);
  filt.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(master);
  src.start(t0);
  src.stop(t0 + dur + 0.03);
}

const SFX = {

  enemyHit: () => tone(240, 180, 0.05, 'triangle', 0.05),

  shieldBreak: () => { tone(1200, 300, 0.28, 'square', 0.12); noiseHit(0.2, 2000, 400, 0.12); },

// 同类音效最短间隔（防爆音）
const MIN_GAP = {
  shoot: 0.045, enemyHit: 0.03, explosion: 0.05, graze: 0.06, laserHum: 0.12, warning: 0.3
};

/* —— BGM：8 小节循环的合成 arpeggio，由主循环驱动，无 setTimeout —— */
const BGM_SCALE = [220, 261.63, 329.63, 392, 440, 523.25, 659.25];
const BGM_BASS = [110, 110, 98, 98, 87.31, 87.31, 98, 98];
const BGM_STEP = 0.24;
let bgmStep = 0;
let bgmTimer = 0;

const audio = {
  init() { const ok = ensureAudio(); if (ok) this.resume(); return ok; },
  resume() { if (actx && actx.state === 'suspended') actx.resume(); },
  get ready() { return !!actx; },
  setMuted(m) { mutedAll = m; if (master) master.gain.value = m ? 0 : 0.5; },
  get muted() { return mutedAll; },
  setBgm(on) { bgmEnabled = on; if (bgmGain) bgmGain.gain.value = on ? 0.16 : 0; },
  get bgm() { return bgmEnabled; },
  play(name) {
    if (!actx || mutedAll) return;
    const fn = SFX[name];
    if (!fn) return;
    const now = actx.currentTime;
    const gap = MIN_GAP[name] || 0;
    if (gap > 0 && lastPlay[name] !== undefined && now - lastPlay[name] < gap) return;
    lastPlay[name] = now;
    fn();
  },
  // 由主循环调用（dt 驱动，不用定时器）
  updateBgm(dt) {
    if (!actx || mutedAll || !bgmEnabled) return;
    bgmTimer -= dt;
    if (bgmTimer > 0) return;
    bgmTimer += BGM_STEP;
    const s = bgmStep % 16;
    if (s % 4 === 0) tone(BGM_BASS[(bgmStep >> 1) % 8], BGM_BASS[(bgmStep >> 1) % 8], 0.5, 'sine', 0.5, bgmGain);
    if (s % 2 === 0) {
      const n = BGM_SCALE[(s + bgmStep) % BGM_SCALE.length];
      tone(n, n, 0.2, 'triangle', 0.22, bgmGain);
    }
    bgmStep++;
  },
  stopBgm() { bgmEnabled = false; if (bgmGain) bgmGain.gain.value = 0; }
};

/* ============================ 画布与视口 ============================ */
const view = {
  canvas: null,
  ctx: null,
  scale: 1,
  dpr: 1,
  ox: 0,
  oy: 0,
  isTouch: false,
  landscape: false
};

function initView(canvas) {
  view.canvas = canvas;
  view.ctx = canvas.getContext('2d', { alpha: false });
  view.isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  resizeView();
  let resizeTimer = null;
  const onResize = () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { resizeTimer = null; resizeView(); }, 150);
  };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
}

function resizeView() {
  const canvas = view.canvas;
  if (!canvas) return;
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  view.landscape = winW > winH * 1.05;
  const scale = Math.min(winW / GAME_W, winH / GAME_H);
  view.scale = scale;
  view.ox = Math.round((winW - GAME_W * scale) / 2);
  view.oy = Math.round((winH - GAME_H * scale) / 2);
  const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  view.dpr = dpr;
  canvas.width = Math.max(1, Math.floor(GAME_W * scale * dpr));
  canvas.height = Math.max(1, Math.floor(GAME_H * scale * dpr));
  canvas.style.width = Math.floor(GAME_W * scale) + 'px';
  canvas.style.height = Math.floor(GAME_H * scale) + 'px';
  canvas.style.left = view.ox + 'px';
  canvas.style.top = view.oy + 'px';
}

function beginFrame(ctx) {
  const k = view.scale * view.dpr;
  ctx.setTransform(k, 0, 0, k, 0, 0);
}

function clientToGame(clientX, clientY, out) {
  out = out || { x: 0, y: 0 };
  out.x = (clientX - view.ox) / view.scale;
  out.y = (clientY - view.oy) / view.scale;
  return out;
}

/* ============================ 输入 ============================ */
const MOVE_KEYS = {
  up: ['KeyW', 'ArrowUp'],
  down: ['KeyS', 'ArrowDown'],
  left: ['KeyA', 'ArrowLeft'],
  right: ['KeyD', 'ArrowRight']
};

const _tmpPt = { x: 0, y: 0 };

const input = {
  keys: new Set(),
  pressed: new Set(),
  pointer: {
    x: GAME_W / 2, y: GAME_H * 0.78,
    down: false, dragging: false,
    justDown: false, justUp: false,
    type: 'mouse'
  },
  vbtn: { bomb: false, skill: false, pause: false },
  _vbtnPrev: { bomb: false, skill: false, pause: false },

  setup(canvas) {
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' ||
        e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'F3') {
        e.preventDefault();
      }
      if (!e.repeat) this.pressed.add(e.code);
      this.keys.add(e.code);
    });
    window.addEventListener('keyup', (e) => { this.keys.delete(e.code); });
    window.addEventListener('blur', () => { this.keys.clear(); });

    const onDown = (e) => {
      this.pointer.type = e.pointerType || 'mouse';
      this.pointer.down = true;
      this.pointer.dragging = true;
      this.pointer.justDown = true;
      const p = clientToGame(e.clientX, e.clientY, _tmpPt);
      this.pointer.x = p.x;
      this.pointer.y = p.y;
    };
    const onMove = (e) => {
      const p = clientToGame(e.clientX, e.clientY, _tmpPt);
      this.pointer.x = p.x;
      this.pointer.y = p.y;
    };
    const onUp = () => {
      this.pointer.down = false;
      this.pointer.dragging = false;
      this.pointer.justUp = true;
    };
    canvas.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  },

  isDown(code) { return this.keys.has(code); },
  anyDown(list) { for (let i = 0; i < list.length; i++) if (this.keys.has(list[i])) return true; return false; },
  wasPressed(code) { return this.pressed.has(code); },
  shiftDown() { return this.keys.has('ShiftLeft') || this.keys.has('ShiftRight'); },

  // 归一化移动向量
  moveVector(out) {
    out = out || { x: 0, y: 0 };
    let x = 0, y = 0;
    if (this.anyDown(MOVE_KEYS.left)) x -= 1;
    if (this.anyDown(MOVE_KEYS.right)) x += 1;
    if (this.anyDown(MOVE_KEYS.up)) y -= 1;
    if (this.anyDown(MOVE_KEYS.down)) y += 1;
    if (x !== 0 && y !== 0) { const k = Math.SQRT1_2; x *= k; y *= k; }
    out.x = x; out.y = y;
    return out;
  },

  // 虚拟按钮：每帧由场景注册的按钮矩形驱动
  updateVirtualButtons(buttons) {
    for (const k in this._vbtnPrev) this._vbtnPrev[k] = this.vbtn[k];
    this.vbtn.bomb = false; this.vbtn.skill = false; this.vbtn.pause = false;
    if (!this.pointer.down) return;
    for (let i = 0; i < buttons.length; i++) {
      const b = buttons[i];
      const dx = this.pointer.x - b.x, dy = this.pointer.y - b.y;
      if (dx * dx + dy * dy <= b.r * b.r) this.vbtn[b.id] = true;
    }
  },
  vbtnPressed(id) { return this.vbtn[id] && !this._vbtnPrev[id]; },

  endFrame() {
    this.pressed.clear();
    this.pointer.justDown = false;
    this.pointer.justUp = false;
  }
};

/* ============================ 相机（震屏 / 闪白 / 色调） ============================ */
const _colorCache = {};
const camera = {
  sx: 0, sy: 0,
  shakeT: 0, shakeDur: 0, shakeAmp: 0,
  flash: 0, flashColor: '#FFFFFF',
  tint: 0, tintColor: '#00F0FF',
  lowHpPulse: 0,

  reset() {
    this.sx = 0; this.sy = 0; this.shakeT = 0; this.shakeDur = 0; this.shakeAmp = 0;
    this.flash = 0; this.tint = 0;
  },
  shake(amp, dur) {
    if (this.shakeT > 0 && amp < this.shakeAmp * 0.6) return;
    this.shakeAmp = amp;
    this.shakeDur = dur;
    this.shakeT = dur;
  },
  flashScreen(color, alpha) {
    this.flashColor = color || '#FFFFFF';
    this.flash = Math.max(this.flash, alpha);
  },
  setTint(color, alpha) {
    this.tintColor = color;
    this.tint = alpha;
  },
  update(dt) {
    if (this.shakeT > 0) {
      this.shakeT -= dt;
      const k = this.shakeT > 0 ? easeOutQuad(this.shakeT / this.shakeDur) : 0;
      const amp = this.shakeAmp * k;
      this.sx = (Math.random() * 2 - 1) * amp;
      this.sy = (Math.random() * 2 - 1) * amp;
      if (this.shakeT <= 0) { this.sx = 0; this.sy = 0; this.shakeAmp = 0; }
    }
    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 3.2);
    if (this.lowHpPulse > 0) this.lowHpPulse -= dt;
  },
  apply(ctx) { ctx.translate(this.sx, this.sy); }
};

/* ============================ 主循环（固定步长 + 时间缩放） ============================ */
const loop = {
  timeScale: 1,
  slowT: 0,
  hitstop: 0,
  running: false,
  fps: 60,
  frameCount: 0,
  _acc: 0,
  _last: 0,
  _fpsAcc: 0,
  _fpsCount: 0,
  _update: null,
  _render: null,

  start(updateFn, renderFn) {
    this._update = updateFn;
    this._render = renderFn;
    this._last = performance.now();
    this.running = true;
    requestAnimationFrame(this._frame);
  },

  _frame: (now) => {
    if (!loop.running) return;
    const raw = Math.min((now - loop._last) / 1000, 0.25); // 钳制：切后台回来不追帧
    loop._last = now;

    loop._fpsAcc += raw;
    loop._fpsCount++;
    if (loop._fpsAcc >= 0.5) {
      loop.fps = Math.round(loop._fpsCount / loop._fpsAcc);
      loop._fpsAcc = 0;
      loop._fpsCount = 0;
    }

    if (loop.slowT > 0) {
      loop.slowT -= raw;
      if (loop.slowT <= 0) { loop.slowT = 0; loop.timeScale = 1; }
    }

    if (loop.hitstop > 0) {
      loop.hitstop--;
    } else {
      loop._acc += raw * loop.timeScale;
      let steps = 0;
      while (loop._acc >= FIXED_DT && steps < 5) {
        loop._update(FIXED_DT);
        loop._acc -= FIXED_DT;
        steps++;
      }
      if (steps >= 5) loop._acc = 0;
    }

    loop.frameCount++;
    loop._render();
    input.endFrame();
    requestAnimationFrame(loop._frame);
  },

  setTimeScale(v, duration) {
    this.timeScale = v;
    this.slowT = duration || 0;
  },
  freeze(frames) { this.hitstop = Math.max(this.hitstop, frames); },
  resetTime() { this.timeScale = 1; this.slowT = 0; this.hitstop = 0; this._acc = 0; }
};

/* ============================ 空间网格（碰撞加速） ============================ */
class SpatialGrid {
  constructor(cell) {
    this.cell = cell;
    this.cells = new Map();
    this.used = [];
  }
  _key(x, y) {
    const cx = Math.floor(x / this.cell);
    const cy = Math.floor(y / this.cell);
    return cx * 100000 + cy;
  }
  clear() {
    for (let i = 0; i < this.used.length; i++) this.used[i].length = 0;
    this.used.length = 0;
  }
  insert(o) {
    const k = this._key(o.x, o.y);
    let a = this.cells.get(k);
    if (!a) { a = []; this.cells.set(k, a); }
    if (a.length === 0) this.used.push(a);
    a.push(o);
  }
  query(x, y, radius, out) {
    out.length = 0;
    const r = radius || 0;
    const c = this.cell;
    const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
    const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
    for (let cx = x0; cx <= x1; cx++) {
      for (let cy = y0; cy <= y1; cy++) {
        const a = this.cells.get(cx * 100000 + cy);
        if (!a) continue;
        for (let i = 0; i < a.length; i++) out.push(a[i]);
      }
    }
    return out;
  }
}

/* ============================ 发光贴图缓存（避免粒子使用 shadowBlur） ============================ */
const glowCache = new Map();

function getGlowSprite(color, size) {
  const key = color + '|' + size;
  let c = glowCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  const s = size * 2;
  c.width = s; c.height = s;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size, size, 0, size, size, size);
  grad.addColorStop(0, color);
  grad.addColorStop(0.35, hexAlpha(color, 0.55));
  grad.addColorStop(1, hexAlpha(color, 0));
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  glowCache.set(key, c);
  return c;
}

// '#RRGGBB' + alpha → 'rgba()'（结果缓存避免每帧字符串拼接）
const alphaCache = new Map();
function hexAlpha(hex, a) {
  const key = hex + (a * 100 | 0);
  let v = alphaCache.get(key);
  if (v) return v;
  let r = 255, g = 255, b = 255;
  if (hex[0] === '#') {
    const h = hex.length === 4
      ? hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3]
      : hex.slice(1);
    r = parseInt(h.slice(0, 2), 16);
    g = parseInt(h.slice(2, 4), 16);
    b = parseInt(h.slice(4, 6), 16);
  }
  v = 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  alphaCache.set(key, v);
  return v;
}

function drawGlow(ctx, x, y, size, color, alpha) {
  const sp = getGlowSprite(color, size);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.drawImage(sp, x - size, y - size, size * 2, size * 2);
  ctx.globalAlpha = 1;
}

/* ============================ 文字 ============================ */
const FONT_UI = "'Segoe UI','Microsoft YaHei',system-ui,sans-serif";
const FONT_MONO = "'Consolas','Courier New',monospace";

function setFont(ctx, size, weight, mono) {
  ctx.font = (weight || 'bold') + ' ' + size + 'px ' + (mono ? FONT_MONO : FONT_UI);
}

function drawText(ctx, text, x, y, o) {
  o = o || {};
  setFont(ctx, o.size || 24, o.weight, o.mono);
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  if (o.glow) { ctx.shadowColor = o.glowColor || o.color || '#FFFFFF'; ctx.shadowBlur = o.glow; }
  if (o.stroke) {
    ctx.lineWidth = o.strokeWidth || 5;
    ctx.strokeStyle = o.strokeColor || THEME.bgDeep;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = o.color || THEME.textPrimary;
  ctx.fillText(text, x, y);
  if (o.glow) ctx.shadowBlur = 0;
}

/* ============================ 深空背景（3 层视差 + 科技网格） ============================ */
const STARS = 170;
const STREAKS = 64;

const bg = {
  theme: 'nebula',
  offset: 0,
  gridOffset: 0,
  speedMul: 1,
  stars: null,
  streaks: null,
  nebula: null,
  flashT: 0,

  init() {
    this.stars = new Array(STARS);
    for (let i = 0; i < STARS; i++) {
      this.stars[i] = {
        x: Math.random() * GAME_W,
        y: Math.random() * GAME_H,
        v: 26 + Math.random() * 60,
        s: 0.8 + Math.random() * 1.8,
        a: 0.25 + Math.random() * 0.6
      };
    }
    this.streaks = new Array(STREAKS);
    for (let i = 0; i < STREAKS; i++) {
      this.streaks[i] = {
        x: Math.random() * GAME_W,
        y: Math.random() * GAME_H,
        v: 240 + Math.random() * 260,
        len: 26 + Math.random() * 60,
        w: 0.8 + Math.random() * 1.6,
        a: 0.16 + Math.random() * 0.34
      };
    }
    this.setTheme('nebula');
  },

  setTheme(name) {
    this.theme = name;
    this.nebula = buildNebula(name);
    this.flashT = 1;
  },

  update(dt) {
    const mul = this.speedMul;
    for (let i = 0; i < STARS; i++) {
      const s = this.stars[i];
      s.y += s.v * dt * mul;
      if (s.y > GAME_H + 4) { s.y = -4; s.x = Math.random() * GAME_W; }
    }
    for (let i = 0; i < STREAKS; i++) {
      const s = this.streaks[i];
      s.y += s.v * dt * mul;
      if (s.y > GAME_H + s.len) { s.y = -s.len; s.x = Math.random() * GAME_W; }
    }
    this.offset = (this.offset + 12 * dt * mul) % GAME_H;
    this.gridOffset = (this.gridOffset + 42 * dt * mul) % 64;
    if (this.flashT > 0) this.flashT = Math.max(0, this.flashT - dt * 1.6);
  },

  render(ctx) {
    const t = THEMES_BG[this.theme] || THEMES_BG.nebula;
    ctx.fillStyle = THEME.bgDeep;
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    // 层 1：星云（预渲染贴图，纵向循环滚动）
    if (this.nebula) {
      const y = -this.offset;
      ctx.drawImage(this.nebula, 0, y);
      ctx.drawImage(this.nebula, 0, y + GAME_H);
      ctx.drawImage(this.nebula, 0, y - GAME_H);
    }

    // 层 2：星点
    ctx.fillStyle = t.accent;
    for (let i = 0; i < STARS; i++) {
      const s = this.stars[i];
      ctx.globalAlpha = s.a;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // 层 3：流光
    ctx.strokeStyle = t.accent;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < STREAKS; i++) {
      const s = this.streaks[i];
      ctx.globalAlpha = s.a;
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x, s.y + s.len);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 科技网格（合并为单次 stroke）
    ctx.strokeStyle = THEME.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = this.gridOffset - 64; y < GAME_H; y += 64) {
      ctx.moveTo(0, y); ctx.lineTo(GAME_W, y);
    }
    for (let x = 0; x < GAME_W; x += 64) {
      ctx.moveTo(x, 0); ctx.lineTo(x, GAME_H);
    }
    ctx.stroke();
  }
};

function buildNebula(themeName) {
  const t = THEMES_BG[themeName] || THEMES_BG.nebula;
  const c = document.createElement('canvas');
  c.width = GAME_W; c.height = GAME_H;
  const g = c.getContext('2d');
  g.fillStyle = THEME.bgMid;
  g.fillRect(0, 0, GAME_W, GAME_H);
  const blobs = [
    { x: 140, y: 240, r: 380 }, { x: 600, y: 520, r: 440 },
    { x: 300, y: 880, r: 420 }, { x: 660, y: 1120, r: 320 },
    { x: 80, y: 700, r: 300 }
  ];
  for (let i = 0; i < blobs.length; i++) {
    const b = blobs[i];
    const grad = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grad.addColorStop(0, hexAlpha(t.cloud, 0.55));
    grad.addColorStop(0.5, hexAlpha(t.cloud, 0.22));
    grad.addColorStop(1, hexAlpha(t.cloud, 0));
    g.fillStyle = grad;
    g.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
  }
  return c;
}

/* ============================ 全屏特效 ============================ */
let scanPattern = null;
let vignetteGrad = null;

function ensureFxCache(ctx) {
  if (!scanPattern) {
    const tile = document.createElement('canvas');
    tile.width = 4; tile.height = 4;
    const g = tile.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,0.16)';
    g.fillRect(0, 0, 4, 2);
    scanPattern = ctx.createPattern(tile, 'repeat');
  }
  if (!vignetteGrad) {
    vignetteGrad = ctx.createRadialGradient(GAME_W / 2, GAME_H / 2, GAME_H * 0.28, GAME_W / 2, GAME_H / 2, GAME_H * 0.72);
    vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vignetteGrad.addColorStop(1, 'rgba(0,0,0,0.62)');
  }
}

function drawScanlines(ctx) {
  ensureFxCache(ctx);
  ctx.fillStyle = scanPattern;
  ctx.globalAlpha = 0.5;
  ctx.fillRect(0, 0, GAME_W, GAME_H);
  ctx.globalAlpha = 1;
}

function drawVignette(ctx) {
  ensureFxCache(ctx);
  ctx.fillStyle = vignetteGrad;
  ctx.fillRect(0, 0, GAME_W, GAME_H);
}

function drawScreenTint(ctx) {
  if (camera.tint > 0.001) {
    ctx.fillStyle = camera.tintColor;
    ctx.globalAlpha = camera.tint;
    ctx.fillRect(-40, -40, GAME_W + 80, GAME_H + 80);
    ctx.globalAlpha = 1;
  }
  if (camera.flash > 0.001) {
    ctx.fillStyle = camera.flashColor;
    ctx.globalAlpha = clamp(camera.flash, 0, 0.85);
    ctx.fillRect(-40, -40, GAME_W + 80, GAME_H + 80);
    ctx.globalAlpha = 1;
  }
}

function drawLowHpWarning(ctx, alpha) {
  if (alpha <= 0.001) return;
  const g = ctx.createLinearGradient(0, 0, 0, GAME_H);
  g.addColorStop(0, hexAlpha(THEME.dangerRed, alpha));
  g.addColorStop(0.35, hexAlpha(THEME.dangerRed, 0));
  g.addColorStop(0.65, hexAlpha(THEME.dangerRed, 0));
  g.addColorStop(1, hexAlpha(THEME.dangerRed, alpha));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, GAME_W, GAME_H);
}

/* ============================ 扫描式警告（Boss 入场） ============================ */
function drawBossWarning(ctx, progress, name, title) {
  // 背景压暗
  ctx.fillStyle = 'rgba(3,4,10,' + (0.5 * Math.min(1, progress * 3)) + ')';
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  // 斜向红色扫描带
  const bandY = ((progress * 1600) % (GAME_H + 400)) - 200;
  ctx.save();
  ctx.globalAlpha = 0.5 + 0.3 * Math.sin(progress * 40);
  ctx.strokeStyle = THEME.dangerRed;
  ctx.lineWidth = 3;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(0, bandY + i * 26);
    ctx.lineTo(GAME_W, bandY + i * 26 - 60);
    ctx.stroke();
  }
  ctx.restore();

  const pulse = 1 + 0.08 * Math.sin(progress * 24);
  ctx.save();
  ctx.translate(GAME_W / 2, GAME_H * 0.42);
  ctx.scale(pulse, pulse);
  const jitter = (Math.random() - 0.5) * 4;
  drawText(ctx, 'WARNING', jitter, 0, {
    size: 92, color: THEME.dangerRed, glow: 32, stroke: true, strokeWidth: 7, strokeColor: '#1A0000'
  });
  ctx.restore();

  drawText(ctx, name, GAME_W / 2, GAME_H * 0.42 + 78, {
    size: 30, color: THEME.textPrimary, glow: 14, stroke: true, strokeWidth: 4
  });
  if (title) {
    drawText(ctx, title, GAME_W / 2, GAME_H * 0.42 - 82, {
      size: 22, color: THEME.textDim, mono: true
    });
  }
}

/* ============================ HUD ============================ */
function drawHearts(ctx, x, y, current, max, color) {
  const w = 16, h = 8, gap = 4;
  for (let i = 0; i < max; i++) {
    const px = x + i * (w + gap);
    ctx.fillStyle = i < current ? color : 'rgba(230,247,255,0.14)';
    ctx.fillRect(px, y, w, h);
    if (i < current) {
      ctx.strokeStyle = hexAlpha(color, 0.8);
      ctx.lineWidth = 1;
      ctx.strokeRect(px - 0.5, y - 0.5, w + 1, h + 1);
    }
  }
  return x + max * (w + gap);
}

const hud = {
  render(ctx, s) {
    ctx.save();

    // 顶部渐变遮罩（提升可读性）
    const g = ctx.createLinearGradient(0, 0, 0, 190);
    g.addColorStop(0, 'rgba(3,5,12,0.85)');
    g.addColorStop(1, 'rgba(3,5,12,0)');

    ctx.fillRect(0, 0, GAME_W, 190);

    // 分数

      size: 34, color: THEME.textPrimary, align: 'left', mono: true, glow: 12, glowColor: THEME.neonCyan
    });
    drawText(ctx, 'SCORE', 24, 62, { size: 13, color: THEME.textDim, align: 'left', mono: true });
    drawText(ctx, formatScore(s.best), GAME_W - 24, 34, {
      size: 20, color: hexAlpha(THEME.warnYellow, 0.9), align: 'right', mono: true
    });
    drawText(ctx, 'BEST', GAME_W - 24, 62, { size: 13, color: THEME.textDim, align: 'right', mono: true });

    // 生命 / 护盾 / 炸弹 / 能量
    const hpColor = s.hp <= 1 ? THEME.dangerRed : (s.hp <= 2 ? THEME.warnYellow : THEME.neonCyan);
    const endX = drawHearts(ctx, 26, 82, s.hp, s.hpMax, hpColor);
    for (let i = 0; i < s.shield; i++) {
      ctx.beginPath();
      ctx.arc(endX + 12 + i * 15, 86, 5.5, 0, TAU);
      ctx.strokeStyle = THEME.neonPurple;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    drawText(ctx, '×' + s.bombs, GAME_W - 118, 86, {
      size: 20, color: THEME.warnYellow, align: 'left', mono: true, glow: 8
    });
    drawText(ctx, 'BOMB', GAME_W - 118, 104, { size: 11, color: THEME.textDim, align: 'left', mono: true });

    // 能量条
    const bx = GAME_W - 74, by = 74, bw = 50, bh = 10;
    ctx.fillStyle = 'rgba(230,247,255,0.14)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = s.energy >= 100 ? THEME.neonCyan : THEME.neonPurple;

    if (s.energy >= 100) {
      ctx.strokeStyle = hexAlpha(THEME.neonCyan, 0.6 + 0.4 * Math.sin(loop.frameCount * 0.2));
      ctx.lineWidth = 2;
      ctx.strokeRect(bx - 2, by - 2, bw + 4, bh + 4);
    }
    drawText(ctx, 'SLOW', bx + bw / 2, 104, { size: 11, color: THEME.textDim, mono: true });

    // 火力等级
    drawText(ctx, 'POWER', 24, 116, { size: 11, color: THEME.textDim, align: 'left', mono: true });
    for (let i = 0; i < 8; i++) {
      ctx.fillStyle = i < s.power ? THEME.neonCyan : 'rgba(230,247,255,0.13)';
      ctx.fillRect(66 + i * 11, 110, 8, 10);
    }

    // 连击
    if (s.combo > 0) {
      const cw = clamp(s.comboTimer / s.comboWindow, 0, 1);
      drawText(ctx, 'x' + s.combo, GAME_W - 26, 210, {
        size: 40, color: THEME.warnYellow, align: 'right', mono: true, glow: 16
      });
      drawText(ctx, 'COMBO  ×' + s.multiplier.toFixed(1), GAME_W - 26, 244, {
        size: 16, color: THEME.textDim, align: 'right', mono: true
      });
      ctx.beginPath();
      ctx.arc(GAME_W - 34, 176, 16, -Math.PI / 2, -Math.PI / 2 + TAU * cw);
      ctx.strokeStyle = cw < 0.3 ? THEME.dangerRed : THEME.warnYellow;
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // Boss 血条
    if (s.boss) hud.renderBossBar(ctx, s.boss);

    // 飘分
    if (s.floaters) {
      for (let i = 0; i < s.floaters.length; i++) {
        const f = s.floaters[i];
        drawText(ctx, f.text, f.x, f.y, {
          size: f.size, color: f.color, glow: 10, align: 'center', mono: true,
          baseline: 'middle'
        });
      }
    }

    ctx.restore();
  },

  renderBossBar(ctx, b) {
    const x = 46, y = 150, w = GAME_W - 92, h = 16;
    drawText(ctx, b.name, x, y - 16, {
      size: 17, color: b.enrage ? THEME.dangerRed : THEME.textPrimary, align: 'left', glow: 10
    });
    drawText(ctx, 'PHASE ' + b.phase + '/' + b.phaseCount, x + w, y - 16, {
      size: 14, color: THEME.textDim, align: 'right', mono: true
    });
    ctx.fillStyle = 'rgba(230,247,255,0.12)';
    ctx.fillRect(x, y, w, h);

    // 分段血条
    const segW = (w - (b.phaseCount - 1) * 3) / b.phaseCount;
    for (let i = 0; i < b.phaseCount; i++) {
      const sx = x + i * (segW + 3);
      const fill = clamp((b.hpPct - i / b.phaseCount) * b.phaseCount, 0, 1);
      ctx.fillStyle = i === b.phaseCount - 1 ? hexAlpha(THEME.dangerRed, 0.9)
        : (i < b.phase - 1 ? hexAlpha(THEME.neonCyan, 0.8) : hexAlpha(THEME.neonMagenta, 0.85));
      ctx.fillRect(sx, y, segW * fill, h);
      ctx.strokeStyle = 'rgba(3,5,12,0.9)';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx, y, segW, h);
    }
    // 部位标记
    if (b.parts) {
      for (let i = 0; i < b.parts.length; i++) {
        const p = b.parts[i];
        if (p.isWeakPoint) continue;
        const px = x + clamp(p.ox / 720 + 0.5, 0, 1) * w;
        ctx.beginPath();
        ctx.arc(px, y + h + 9, 4.5, 0, TAU);
        ctx.fillStyle = p.destroyed ? 'rgba(230,247,255,0.18)' : p.color;
        ctx.fill();
        if (p.destroyed) {
          ctx.strokeStyle = THEME.dangerRed;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px - 4, y + h + 5); ctx.lineTo(px + 4, y + h + 13);
          ctx.moveTo(px + 4, y + h + 5); ctx.lineTo(px - 4, y + h + 13);
          ctx.stroke();
        }
      }
    }
    // 狂暴提示
    if (b.enrage) {
      const a = 0.35 + 0.3 * Math.sin(loop.frameCount * 0.15);
      ctx.strokeStyle = hexAlpha(THEME.dangerRed, a);
      ctx.lineWidth = 4;
      ctx.strokeRect(-2, -2, GAME_W + 4, GAME_H + 4);
      drawText(ctx, 'ENRAGED', GAME_W / 2, y + h + 22, {
        size: 15, color: THEME.dangerRed, mono: true, glow: 12
      });
    }
  }
};

/* ===================== game/entities.js ===================== */
// 实体层：玩家 / 子弹 / 激光 / 敌机 / Boss / 道具 / 僚机 / 粒子

/* ============================ 玩家 ============================ */
class Player {
  constructor() {
    this.x = GAME_W / 2;
    this.y = GAME_H - 180;
    this.tx = this.x; this.ty = this.y;
    this.vx = 0; this.vy = 0;
    this.cfg = null;
    this.radius = BALANCE.playerHitRadius;
    this.angle = -Math.PI / 2;
    this.invuln = 0;
    this.hitFlash = 0;
    this.engineT = 0;
    this.dashT = 0;
    this.dashDir = { x: 0, y: 0 };
    this.lastTap = {};
    this.shieldRegenT = 45;
    this.rollT = 0;
    this.fireTimer = 0;
    this.beam = null;
    this.dead = false;
    this.reset('falcon');
  }

  reset(playerId) {
    const cfg = PLAYERS.find((p) => p.id === playerId) || PLAYERS[0];
    this.cfg = cfg;
    this.color = cfg.color;
    this.accent = cfg.accent;
    this.speed = cfg.speed;
    this.hpMax = cfg.maxHp;
    this.hp = cfg.maxHp;
    this.shieldMax = BALANCE.shieldMax;
    this.shield = cfg.shield;
    this.bombMax = BALANCE.bombMax;
    this.bombs = cfg.bombCount;
    this.power = cfg.startPower;
    this.weaponId = 'vulcan';
    this.weaponLevel = cfg.startPower;
    this.energy = 0;
    this.invuln = 0;
    this.fireRateMul = cfg.fireRateMul;
    this.damageMul = cfg.damageMul;
    this.magnetBonus = 0;
    this.scoreMul = 1;
    this.slowMul = 1;
    this.pierceBonus = 0;
    this.wingmanMax = 0;
    this.grazeShieldOn = false;
    this.grazeCount = 0;
    this.grazeTotal = 0;
    this.special = cfg.special;
    this.shieldRegenT = 45;
    this.dashT = 0;
    this.fireTimer = 0;
    this.beam = null;
    this.dead = false;
    this.x = GAME_W / 2;
    this.y = GAME_H - 180;
    this.tx = this.x; this.ty = this.y;
  }

  get alive() { return this.hp > 0; }

  update(dt, pointerControl) {
    // —— 移动：键盘 + 指针跟随 ——
    if (pointerControl && !this.dead) {
      const k = 1 - Math.pow(0.0015, dt); // 平滑跟随
      const offY = input.pointer.type === 'touch' ? -70 : 0;
      this.x += (input.pointer.x - this.x) * k;
      this.y += (input.pointer.y + offY - this.y) * k;
    } else {
      const mv = input.moveVector(_mv);
      const spd = this.speed * (this.weaponId === 'laser' ? 0.9 : 1) * (this.dashT > 0 ? 2.6 : 1);
      if (this.dashT > 0) {
        this.x += this.dashDir.x * spd * dt;
        this.y += this.dashDir.y * spd * dt;
        this.dashT -= dt;
      } else if (mv.x !== 0 || mv.y !== 0) {
        this.x += mv.x * spd * dt;
        this.y += mv.y * spd * dt;
        if (mv.x !== 0) this.rollT = clamp(this.rollT + dt * 6, -1, 1) * Math.sign(mv.x);
      } else {
        this.rollT *= Math.max(0, 1 - dt * 8);
      }
    }
    this.x = clamp(this.x, PHYS.playerPadding + 24, GAME_W - PHYS.playerPadding - 24);
    this.y = clamp(this.y, 120, GAME_H - PHYS.playerPadding - 20);
    this.rollT *= Math.max(0, 1 - dt * 6);

    if (this.invuln > 0) this.invuln -= dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    this.engineT += dt;

    // —— 机型特殊能力 ——
    if (this.special === 'phaseDash') this._updateDash(dt);
    if (this.special === 'shieldRegen' && this.shield < 2) {
      this.shieldRegenT -= dt;
      if (this.shieldRegenT <= 0) {
        this.shieldRegenT = 45;
        this.shield++;
        camera.flashScreen(this.color, 0.12);
      }
    }
  }

  _updateDash(dt) {
    const keys = ['KeyW', 'KeyS', 'KeyA', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      if (input.wasPressed(k)) {
        const now = performance.now();
        if (this.lastTap[k] && now - this.lastTap[k] < 280) {
          this.dashT = 0.15;
          this.invuln = Math.max(this.invuln, 0.15);
          this.dashDir.x = k === 'KeyA' || k === 'ArrowLeft' ? -1 : (k === 'KeyD' || k === 'ArrowRight' ? 1 : 0);
          this.dashDir.y = k === 'KeyW' || k === 'ArrowUp' ? -1 : (k === 'KeyS' || k === 'ArrowDown' ? 1 : 0);
          camera.flashScreen(this.color, 0.1);
        }
        this.lastTap[k] = now;
      }
    }
  }

  // 返回 'none' | 'shield' | 'death'
  hit() {
    if (this.invuln > 0) return 'none';
    if (this.shield > 0) {
      this.shield--;
      this.invuln = BALANCE.invulnShield;
      this.hitFlash = 0.5;
      eventBus.emit(EV.PLAYER_SHIELD_BREAK, {});
      return 'shield';
    }
    this.hp--;
    this.invuln = BALANCE.invulnDeath;
    this.hitFlash = 0.6;
    this.power = Math.max(1, this.power - 1);
    this.weaponLevel = Math.max(1, this.power);
    eventBus.emit(EV.PLAYER_HIT, { hpLeft: this.hp });
    if (this.hp <= 0) eventBus.emit(EV.PLAYER_DIED, {});
    return 'death';
  }

  addEnergy(v) { this.energy = clamp(this.energy + v, 0, 100); }

  render(ctx) {
    const blink = this.invuln > 0 && Math.floor(this.invuln * 14) % 2 === 0;
    ctx.save();
    ctx.translate(this.x, this.y);
    if (blink) ctx.globalAlpha = 0.35;
    const roll = this.rollT * 0.32;
    ctx.rotate(roll);

    const w = this.cfg.size.w, h = this.cfg.size.h;
    // 引擎焰
    const fl = 12 + Math.sin(this.engineT * 40) * 5 + Math.random() * 4;
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(ctx, 0, h * 0.5 + fl * 0.4, 16, this.color, 0.55);
    ctx.beginPath();
    ctx.moveTo(-7, h * 0.42);
    ctx.lineTo(0, h * 0.42 + fl);
    ctx.lineTo(7, h * 0.42);
    ctx.closePath();
    ctx.fillStyle = hexAlpha(this.accent, 0.9);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // 机翼
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.5);
    ctx.lineTo(w * 0.22, -h * 0.05);
    ctx.lineTo(w * 0.5, h * 0.2);
    ctx.lineTo(w * 0.34, h * 0.38);
    ctx.lineTo(w * 0.1, h * 0.3);
    ctx.lineTo(-w * 0.1, h * 0.3);
    ctx.lineTo(-w * 0.34, h * 0.38);
    ctx.lineTo(-w * 0.5, h * 0.2);
    ctx.lineTo(-w * 0.22, -h * 0.05);
    ctx.closePath();
    ctx.fillStyle = this.hitFlash > 0 ? '#FFFFFF' : '#0E1A2C';
    ctx.fill();
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 机身
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.5);
    ctx.lineTo(w * 0.16, h * 0.16);
    ctx.lineTo(0, h * 0.3);
    ctx.lineTo(-w * 0.16, h * 0.16);
    ctx.closePath();
    ctx.fillStyle = hexAlpha(this.color, 0.85);
    ctx.fill();

    // 座舱
    ctx.beginPath();
    ctx.ellipse(0, -h * 0.16, 4.5, 9, 0, 0, TAU);
    ctx.fillStyle = '#EAFBFF';
    ctx.fill();
    ctx.restore();

    // 判定点 + 擦弹环
    if (this.invuln <= 0) {
      ctx.beginPath();
      ctx.arc(this.x, this.y - 6, 3.2, 0, TAU);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x, this.y - 6, 3.2 + 1.6 * Math.sin(this.engineT * 6), 0, TAU);
      ctx.strokeStyle = hexAlpha(THEME.neonCyan, 0.9);
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(this.x, this.y, 26 + Math.sin(this.engineT * 10) * 3, 0, TAU);
      ctx.strokeStyle = hexAlpha(this.color, 0.55);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

/* ============================ 子弹 ============================ */
class Bullet {
  constructor() {
    this.active = false;
    this.trail = [0, 0, 0, 0, 0, 0];
  }
  init(o) {
    this.x = o.x; this.y = o.y;
    this.vx = o.vx || 0; this.vy = o.vy || 0;
    this.radius = o.radius || 5;
    this.damage = o.damage || 10;
    this.faction = o.faction || 'player';
    this.color = o.color || THEME.neonCyan;
    this.sprite = o.sprite || 'dart';
    this.pierce = o.pierce || 0;
    this.homing = o.homing || 0;
    this.turnRate = o.turnRate || 0;
    this.explodeRadius = o.explodeRadius || 0;
    this.life = o.life || 6;
    this.angle = Math.atan2(this.vy, this.vx);
    this.hitFlash = 0;
    this.hitIds = null;
    this.target = o.target || null;
    this.grazed = false;
    this.mineT = 0;
    this.minePattern = null;
    this.mineCount = 0;
    this.trail[0] = this.x; this.trail[1] = this.y;
    this.trail[2] = this.x; this.trail[3] = this.y;
    this.trail[4] = this.x; this.trail[5] = this.y;
    this.spin = 0;
  }
  update(dt) {
    // 追踪
    if (this.homing && this.target && this.target.active !== false && this.target.hp > 0) {
      const want = angleTo(this.x, this.y, this.target.x, this.target.y);
      let diff = want - this.angle;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      const maxTurn = this.turnRate * dt;
      this.angle += clamp(diff, -maxTurn, maxTurn);
      const sp = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      this.vx = Math.cos(this.angle) * sp;
      this.vy = Math.sin(this.angle) * sp;
    } else {
      this.angle = Math.atan2(this.vy, this.vx);
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.trail[4] = this.trail[2]; this.trail[5] = this.trail[3];
    this.trail[2] = this.trail[0]; this.trail[3] = this.trail[1];
    this.trail[0] = this.x; this.trail[1] = this.y;
    this.life -= dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    if (this.spin) this.angle += this.spin * dt;
  }
  offscreen() {
    const p = PHYS.bulletOffscreenPad;
    return this.x < -p || this.x > GAME_W + p || this.y < -p || this.y > GAME_H + p;
  }
  render(ctx) {
    ctx.save();
    if (this.faction === 'player') {
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(ctx, this.x, this.y, this.radius * 2.6, this.color, 0.5);
      ctx.globalCompositeOperation = 'source-over';
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.beginPath();
      ctx.moveTo(this.radius * 2.4, 0);
      ctx.lineTo(-this.radius * 1.2, this.radius * 0.9);
      ctx.lineTo(-this.radius * 1.2, -this.radius * 0.9);
      ctx.closePath();
      ctx.fillStyle = this.hitFlash > 0 ? '#FFFFFF' : this.color;
      ctx.fill();
    } else {
      // 敌弹：拖尾 + 球体 + 外环
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = 0.14 - i * 0.04;
        ctx.beginPath();
        ctx.arc(this.trail[i * 2], this.trail[i * 2 + 1], this.radius * 0.9, 0, TAU);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      drawGlow(ctx, this.x, this.y, this.radius * 3, this.color, 0.65);
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, TAU);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.42, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ============================ 激光（矩形判定） ============================ */
class Beam {
  constructor() { this.active = false; }
  init(o) {
    this.x = o.x; this.y = o.y;
    this.angle = o.angle === undefined ? -Math.PI / 2 : o.angle;
    this.width = o.width || 20;
    this.length = o.length || GAME_H;
    this.color = o.color || THEME.neonMagenta;
    this.dps = o.dps || 0;
    this.damage = o.damage || 0;
    this.faction = o.faction || 'enemy';
    this.warnT = o.warnTime || 0;
    this.activeT = o.activeTime || 2;
    this.total = this.warnT + this.activeT;
    this.life = this.total;
    this.state = this.warnT > 0 ? 'warn' : 'active';
    this.rotateSpeed = o.rotateSpeed || 0;
    this.follow = o.follow || null;
    this.tickTimer = 0;
    this.ownerId = o.ownerId;
  }
  update(dt) {
    if (this.follow) { this.x = this.follow.x; this.y = this.follow.y; }
    if (this.rotateSpeed) this.angle += this.rotateSpeed * dt;
    this.life -= dt;
    if (this.state === 'warn' && this.warnT > 0) {
      this.warnT -= dt;
      if (this.warnT <= 0) this.state = 'active';
    }
    this.tickTimer -= dt;
  }
  // 点到线段距离，判断是否命中
  hits(px, py, pr) {
    if (this.state !== 'active') return false;
    const ex = this.x + Math.cos(this.angle) * this.length;
    const ey = this.y + Math.sin(this.angle) * this.length;
    const dx = ex - this.x, dy = ey - this.y;
    const len2 = dx * dx + dy * dy || 1;
    let t = ((px - this.x) * dx + (py - this.y) * dy) / len2;
    t = clamp(t, 0, 1);
    const cx = this.x + dx * t, cy = this.y + dy * t;
    return dist(px, py, cx, cy) < this.width * 0.5 + pr;
  }
  render(ctx) {
    const ex = this.x + Math.cos(this.angle) * this.length;
    const ey = this.y + Math.sin(this.angle) * this.length;
    ctx.save();
    if (this.state === 'warn') {
      ctx.globalAlpha = 0.35 + 0.3 * Math.sin(loop.frameCount * 0.4);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      ctx.strokeStyle = hexAlpha(this.color, 0.28);
      ctx.lineWidth = this.width * 1.9;
      ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = hexAlpha(this.color, 0.75);
      ctx.lineWidth = this.width;
      ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = this.width * 0.34;
      ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(ex, ey); ctx.stroke();
    }
    ctx.restore();
  }
}

/* ============================ 敌机 ============================ */
class Enemy {
  constructor() { this.active = false; this.type = 'enemy'; }
  init(cfg, x, y, opts) {
    opts = opts || {};
    this.cfg = cfg;
    this.id = cfg.id;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.radius = cfg.radius;
    this.hp = Math.round(cfg.hp * (opts.hpMul || 1));
    this.maxHp = this.hp;
    this.shieldHp = Math.round((cfg.shieldHp || 0) * (opts.hpMul || 1));
    this.shieldMax = this.shieldHp;
    this.score = cfg.score;
    this.ramDamage = cfg.ramDamage || 1;
    this.hitFlash = 0;
    this.t = 0;
    this.speed = cfg.speed * (opts.speedMul || 1);
    this.fireInterval = cfg.fireInterval || 0;
    this.fireTimer = this.fireInterval > 0 ? 0.6 + Math.random() * 0.5 : 0;
    this.bulletSpeedMul = opts.bulletSpeedMul || 1;
    this.attackMul = opts.attackMul === undefined ? 1 : opts.attackMul;
    this.targetY = opts.targetY === undefined ? randRange(160, 420) : opts.targetY;
    this.dir = opts.dir || 1;
    this.phase = 'enter';
    this.phaseT = 0;
    this.diveVX = 0; this.diveVY = 0;
    this.trail = 0;
    this.dead = false;
    this.angle = Math.PI / 2;
    this.spawnDelay = opts.spawnDelay || 0;
    this.alpha = 1;
    // 盘旋型敌机不会自己飞出屏幕，给一个滞留时限后强制离场，避免对象池被占满
    const hovers = cfg.pattern === 'hoverFire' || cfg.pattern === 'cruise';
    this.exitAt = cfg.exitAfter || (hovers ? 9 + Math.random() * 4 : 0);
  }

  update(dt, player) {
    if (this.spawnDelay > 0) { this.spawnDelay -= dt; this.alpha = clamp(1 - this.spawnDelay, 0.2, 1); }
    this.t += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    const s = this.speed;

    // 滞留超时：放弃盘旋，加速俯冲离场
    if (this.exitAt > 0 && this.t > this.exitAt) {
      this.vx *= Math.max(0, 1 - dt * 2.5);
      this.vy = s * 1.5;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.angle = Math.PI / 2;
      return;
    }

    switch (this.cfg.pattern) {
      case 'straightDown':
        this.vy = s;
        break;
      case 'sineWeave':
        this.vy = s * 0.62;
        this.vx = Math.sin(this.t * 2.1) * 150;
        break;
      case 'hoverThenDive':
        if (this.phase === 'enter') {
          this.vy = s;
          if (this.y > this.targetY) { this.phase = 'hover'; this.phaseT = 0.7; this.vy = 0; }
        } else if (this.phase === 'hover') {
          this.vy = 0;
          this.phaseT -= dt;
          if (this.phaseT <= 0) {
            this.phase = 'dive';
            const a = player ? angleTo(this.x, this.y, player.x, player.y) : Math.PI / 2;
            this.diveVX = Math.cos(a) * s * 2.4;
            this.diveVY = Math.sin(a) * s * 2.4;
            this.angle = a;
          }
        } else {
          this.vx = this.diveVX;
          this.vy = this.diveVY;
          this.diveVY += 90 * dt;
        }
        break;
      case 'hoverFire':
        if (this.y < this.targetY) { this.vy = s; }
        else { this.vy = Math.sin(this.t * 1.6) * 22; this.vx = Math.sin(this.t * 0.9) * 60; }
        break;
      case 'cruise':
        if (this.phase === 'enter') {
          this.vy = s;
          if (this.y >= this.targetY) { this.phase = 'cruise'; this.dir = Math.random() < 0.5 ? -1 : 1; }
        } else {
          this.vy = Math.sin(this.t * 1.2) * 26;
          this.vx = this.dir * s * 1.4;
          if (this.x < 70) { this.x = 70; this.dir = 1; }
          if (this.x > GAME_W - 70) { this.x = GAME_W - 70; this.dir = -1; }
        }
        break;
      case 'arcEntry':
        if (this.phase === 'enter') {
          this.vy = s * 0.8;
          this.vx = this.dir * s * 0.85;
          if (this.y > this.targetY) this.phase = 'drop';
        } else {
          this.vx *= Math.max(0, 1 - dt * 2);
          this.vy = s;
        }
        break;
      default:
        this.vy = s;
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < this.radius) { this.x = this.radius; this.vx = Math.abs(this.vx); }
    if (this.x > GAME_W - this.radius) { this.x = GAME_W - this.radius; this.vx = -Math.abs(this.vx); }
    // 默认朝下；自爆机沿飞行方向转向
    if (this.cfg.pattern === 'hoverThenDive') this.angle = Math.atan2(this.vy, this.vx);
    else this.angle = Math.PI / 2;
  }

  offscreen() { return this.y > GAME_H + PHYS.enemyOffscreenPad; }

  damage(v) {
    if (this.shieldHp > 0) {
      this.shieldHp -= v;
      if (this.shieldHp < 0) { this.hp += this.shieldHp; this.shieldHp = 0; }
    } else {
      this.hp -= v;
    }
    this.hitFlash = 0.09;
    return this.hp <= 0;
  }

  render(ctx) {
    const c = this.cfg;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.translate(this.x, this.y);
    const bodyColor = this.hitFlash > 0 ? '#FFFFFF' : c.color;
    drawShape(ctx, c.shape, c.size, bodyColor, this.angle - Math.PI / 2);
    if (this.shieldHp > 0) {
      ctx.beginPath();
      ctx.arc(0, 0, this.radius + 5, 0, TAU);
      ctx.strokeStyle = hexAlpha(THEME.neonPurple, 0.35 + 0.5 * (this.shieldHp / Math.max(1, this.shieldMax)));
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    // 血条（受伤后显示）
    if (this.hp < this.maxHp) {
      const w = this.radius * 1.8;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(-w / 2, -this.radius - 12, w, 4);
      ctx.fillStyle = THEME.dangerRed;
      ctx.fillRect(-w / 2, -this.radius - 12, w * clamp(this.hp / this.maxHp, 0, 1), 4);
    }
    ctx.restore();
  }
}

function drawShape(ctx, shape, size, color, rot) {
  ctx.rotate(rot || 0);
  ctx.beginPath();
  const s = size;
  switch (shape) {
    case 'triangle':
      ctx.moveTo(0, s * 0.7); ctx.lineTo(-s * 0.62, -s * 0.5); ctx.lineTo(s * 0.62, -s * 0.5);
      break;
    case 'diamond':
      ctx.moveTo(0, s * 0.75); ctx.lineTo(-s * 0.6, 0); ctx.lineTo(0, -s * 0.75); ctx.lineTo(s * 0.6, 0);
      break;
    case 'arrow':
      ctx.moveTo(0, s * 0.8); ctx.lineTo(-s * 0.5, -s * 0.2); ctx.lineTo(-s * 0.18, -s * 0.2);
      ctx.lineTo(-s * 0.18, -s * 0.62); ctx.lineTo(s * 0.18, -s * 0.62); ctx.lineTo(s * 0.18, -s * 0.2);
      ctx.lineTo(s * 0.5, -s * 0.2);
      break;
    case 'hex':
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + Math.PI / 6;
        const px = Math.cos(a) * s * 0.72, py = Math.sin(a) * s * 0.72;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      break;
    case 'saucer':
      ctx.ellipse(0, 0, s * 0.85, s * 0.45, 0, 0, TAU);
      break;
    case 'cross':
      ctx.moveTo(0, s * 0.8); ctx.lineTo(-s * 0.28, s * 0.2); ctx.lineTo(-s * 0.8, s * 0.2);
      ctx.lineTo(-s * 0.8, -s * 0.2); ctx.lineTo(-s * 0.28, -s * 0.2); ctx.lineTo(0, -s * 0.8);
      ctx.lineTo(s * 0.28, -s * 0.2); ctx.lineTo(s * 0.8, -s * 0.2); ctx.lineTo(s * 0.8, s * 0.2);
      ctx.lineTo(s * 0.28, s * 0.2);
      break;
    default:
      ctx.arc(0, 0, s * 0.6, 0, TAU);
  }
  ctx.closePath();
  ctx.fillStyle = hexAlpha(color, 0.9);
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.18, 0, TAU);
  ctx.fillStyle = '#FFFFFF';
  ctx.fill();
}

/* ============================ Boss ============================ */
class Boss {
  constructor() { this.active = false; this.type = 'boss'; }
  init(cfg, opts) {
    opts = opts || {};
    this.active = true;
    this.cfg = cfg;
    this.id = cfg.id;
    this.name = cfg.name;
    this.x = GAME_W / 2;
    this.y = cfg.entryFromY;
    this.radius = cfg.radius;
    this.hpMul = opts.hpMul || 1;
    this.maxHp = Math.round(cfg.totalHp * this.hpMul);
    this.hp = this.maxHp;
    this.score = cfg.score;
    this.hitFlash = 0;
    this.state = 'entry';
    this.stateT = 0;
    this.phaseIdx = 0;
    this.enrage = false;
    this.invuln = true;
    this.seqT = 0;
    this.seqIdx = 0;
    this.bulletSpeedMul = opts.bulletSpeedMul || 1;
    this.attackMul = 1;
    this.dropTimer = BALANCE.bossDropPreDelay;
    this.moveT = 0;
    this.moveDir = 1;
    this.dyingT = 0;
    this.teleportT = 4;
    this.dead = false;
    this.coreExposed = false;
    this.parts = cfg.parts.map((d) => ({
      def: d,
      id: d.id,
      ox: d.ox, oy: d.oy,
      x: this.x + d.ox, y: this.y + d.oy,
      radius: d.radius,
      maxHp: Math.round(d.hp * this.hpMul),
      hp: Math.round(d.hp * this.hpMul),
      destroyed: d.hp <= 0 && !d.isWeakPoint,
      isWeakPoint: !!d.isWeakPoint,
      weakPointMul: d.weakPointMul || 1,
      attacking: !!d.attacking,
      color: d.color || '#FF2E88',
      hitFlash: 0
    }));
    this.phaseCount = cfg.phases.length;
  }

  get hpPct() { return clamp(this.hp / this.maxHp, 0, 1); }
  get phase() { return this.phaseIdx + 1; }
  get currentPhaseDef() { return this.cfg.phases[this.phaseIdx]; }

  get attackParts() { return this.parts.filter((p) => p.attacking && !p.destroyed).length; }
  // 部位被破坏后火力衰减
  get fireMul() {
    let destroyedAtk = 0;
    for (let i = 0; i < this.parts.length; i++) {
      const p = this.parts[i];
      if (p.attacking && p.destroyed) destroyedAtk++;
    }
    return Math.max(0.45, 1 - 0.12 * destroyedAtk);
  }

  updateParts() {
    for (let i = 0; i < this.parts.length; i++) {
      const p = this.parts[i];
      p.x = this.x + p.ox;
      p.y = this.y + p.oy;
      if (p.hitFlash > 0) p.hitFlash -= FIXED_DT;
    }
  }

  damagePart(part, v) {
    if (part.destroyed) return false;
    part.hp -= v;
    part.hitFlash = 0.1;
    if (part.hp <= 0) {
      part.destroyed = true;
      eventBus.emit(EV.BOSS_PART_DESTROYED, { partId: part.id, x: part.x, y: part.y, color: part.color });
      if (this.parts.every((p) => p.destroyed || p.isWeakPoint)) this.coreExposed = true;
      return true;
    }
    return false;
  }

  // 返回 'phase' | 'dead' | 'none'
  damage(v) {
    if (this.invuln || this.state === 'entry' || this.state === 'dying') return 'none';
    this.hp -= v;
    this.hitFlash = 0.06;
    if (this.hp <= 0) {
      this.hp = 0;
      this.state = 'dying';
      this.dyingT = this.cfg.deathSequence.duration;
      this.dead = true;
      return 'dead';
    }
    const curDef = this.cfg.phases[this.phaseIdx];
    const isLast = this.phaseIdx >= this.cfg.phases.length - 1;
    if (!isLast && this.hpPct <= curDef.hpAbove) return 'phase';
    return 'none';
  }

  advancePhase() {
    if (this.phaseIdx < this.cfg.phases.length - 1) this.phaseIdx++;
    const def = this.currentPhaseDef;
    this.enrage = this.phaseIdx === this.cfg.phases.length - 1;
    this.seqT = 0;
    this.seqIdx = 0;
    this.attackMul = def.enrageMul || 1;
  }

  update(dt) {
    this.stateT += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;

    if (this.state === 'entry') {
      const d = this.cfg.entryDuration;
      const k = clamp(this.stateT / d, 0, 1);
      this.y = this.cfg.entryFromY + (this.cfg.entryToY - this.cfg.entryFromY) * (1 - Math.pow(1 - k, 3));
      if (k >= 1) { this.state = 'combat'; this.stateT = 0; this.invuln = false; }
      this.updateParts();
      return;
    }
    if (this.state === 'transition') {
      if (this.stateT >= this.cfg.phaseTransition.duration) {
        this.state = 'combat';
        this.stateT = 0;
        this.invuln = false;
        this.advancePhase();
      }
      this.updateParts();
      return;
    }
    if (this.state === 'dying') {
      this.dyingT -= dt;
      this.y += 14 * dt;
      this.updateParts();
      return;
    }

    // —— 移动模式 ——
    this.moveT += dt;
    const mode = this.currentPhaseDef.move;
    const spd = (mode === 'strafeFast' || mode === 'aggressive') ? 130 : 80;
    if (mode === 'teleport') {
      this.teleportT -= dt;
      if (this.teleportT <= 0) {
        this.teleportT = 3.4;
        this.x = randRange(160, GAME_W - 160);
        this.y = randRange(160, 300);
        eventBus.emit(EV.SKILL_USED, { kind: 'bossTeleport', x: this.x, y: this.y });
      }
    } else {
      this.x += this.moveDir * spd * dt;
      if (this.x < 150) { this.x = 150; this.moveDir = 1; }
      if (this.x > GAME_W - 150) { this.x = GAME_W - 150; this.moveDir = -1; }
      if (mode === 'switchSides') {
        this.y = 210 + Math.sin(this.moveT * 0.7) * 46;
      } else if (mode === 'aggressive') {
        this.y = 200 + Math.sin(this.moveT * 1.1) * 60;
      }
    }
    this.updateParts();
  }

  render(ctx) {
    const flash = this.hitFlash > 0;
    const bodyColor = flash ? '#FFFFFF' : this.cfg.color;

    ctx.save();
    ctx.translate(this.x, this.y);

    // 主体
    ctx.beginPath();
    ctx.moveTo(0, this.radius * 0.9);
    ctx.lineTo(-this.radius * 0.95, this.radius * 0.1);
    ctx.lineTo(-this.radius * 0.62, -this.radius * 0.7);
    ctx.lineTo(this.radius * 0.62, -this.radius * 0.7);
    ctx.lineTo(this.radius * 0.95, this.radius * 0.1);
    ctx.closePath();
    ctx.fillStyle = flash ? '#FFFFFF' : 'rgba(10,16,30,0.95)';
    ctx.fill();
    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = 4;
    ctx.shadowColor = this.cfg.color;
    ctx.shadowBlur = 22;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 内部结构线
    ctx.strokeStyle = hexAlpha(this.cfg.color, 0.6);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-this.radius * 0.7, -this.radius * 0.2);
    ctx.lineTo(this.radius * 0.7, -this.radius * 0.2);
    ctx.moveTo(-this.radius * 0.5, this.radius * 0.35);
    ctx.lineTo(this.radius * 0.5, this.radius * 0.35);
    ctx.stroke();
    ctx.restore();

    // 部位
    for (let i = 0; i < this.parts.length; i++) {
      const p = this.parts[i];
      ctx.save();
      ctx.translate(p.x, p.y);
      if (p.isWeakPoint) {
        const exposed = this.coreExposed;
        const pulse = 1 + 0.12 * Math.sin(loop.frameCount * 0.16);
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(ctx, 0, 0, p.radius * 2.1 * pulse, exposed ? THEME.dangerRed : p.def.color, exposed ? 0.9 : 0.5);
        ctx.globalCompositeOperation = 'source-over';
        ctx.beginPath();
        ctx.arc(0, 0, p.radius * pulse, 0, TAU);
        ctx.fillStyle = exposed ? hexAlpha(THEME.dangerRed, 0.95) : hexAlpha(p.def.color, 0.8);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, p.radius * 0.45, 0, TAU);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        if (exposed) {
          ctx.beginPath();
          ctx.arc(0, 0, p.radius * 1.5, 0, TAU);
          ctx.strokeStyle = hexAlpha(THEME.dangerRed, 0.6);
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      } else if (p.destroyed) {
        ctx.beginPath();
        ctx.arc(0, 0, p.radius * 0.85, 0, TAU);
        ctx.fillStyle = 'rgba(20,14,14,0.9)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,120,80,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        // 破损裂纹
        ctx.beginPath();
        ctx.moveTo(-p.radius * 0.5, -p.radius * 0.3);
        ctx.lineTo(0, 0);
        ctx.lineTo(p.radius * 0.4, p.radius * 0.4);
        ctx.stroke();
      } else {
        const col = p.hitFlash > 0 ? '#FFFFFF' : p.color;
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = k / 6 * TAU + Math.PI / 6;
          const px = Math.cos(a) * p.radius * 0.9, py = Math.sin(a) * p.radius * 0.9;
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = hexAlpha(col, 0.85);
        ctx.fill();
        ctx.strokeStyle = col;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = col;
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, 0, p.radius * 0.24, 0, TAU);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
      }
      ctx.restore();
    }

    // 阶段切换护盾
    if (this.state === 'transition' || this.state === 'entry') {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius * 1.35, 0, TAU);
      ctx.strokeStyle = hexAlpha(THEME.neonCyan, 0.5 + 0.4 * Math.sin(loop.frameCount * 0.3));
      ctx.lineWidth = 4;
      ctx.stroke();
    }
  }
}

/* ============================ 道具 ============================ */
class Pickup {
  constructor() { this.active = false; this.type = 'pickup'; }
  init(kind, x, y, cfg) {
    this.kind = kind;
    this.cfg = cfg;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = BALANCE.pickupFallSpeed;
    this.radius = 16;
    this.life = BALANCE.pickupLifetime;
    this.magnet = false;
    this.t = 0;
  }
  update(dt, player, magnetRadius) {
    this.t += dt;
    if (player) {
      const d = dist(this.x, this.y, player.x, player.y);
      if (d < magnetRadius) {
        this.magnet = true;
        const a = angleTo(this.x, this.y, player.x, player.y);
        const pull = 900 * (1 - d / magnetRadius) + 260;
        this.vx += Math.cos(a) * pull * dt;
        this.vy += Math.sin(a) * pull * dt;
        const sp = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        const maxSp = 1100;
        if (sp > maxSp) { this.vx = this.vx / sp * maxSp; this.vy = this.vy / sp * maxSp; }
      } else {
        this.vy = BALANCE.pickupFallSpeed;
        this.vx *= Math.max(0, 1 - dt * 3);
      }
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
  }
  offscreen() { return this.y > GAME_H + 40 || this.life <= 0; }
  get expiring() { return this.life < BALANCE.pickupBlinkTime; }
  render(ctx) {
    const blink = this.expiring && Math.floor(this.t * 12) % 2 === 0;
    if (blink) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(ctx, 0, 0, 30, this.cfg.color, 0.6);
    ctx.globalCompositeOperation = 'source-over';
    ctx.rotate(Math.sin(this.t * 2) * 0.25);
    ctx.beginPath();
    const s = 15;
    ctx.moveTo(0, -s); ctx.lineTo(s * 0.85, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.85, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(6,10,20,0.9)';
    ctx.fill();
    ctx.strokeStyle = this.cfg.color;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = this.cfg.color;
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.save();
    ctx.font = 'bold 15px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = this.cfg.color;
    ctx.fillText(this.cfg.label, this.x, this.y + 1);
    ctx.restore();
  }
}

/* ============================ 僚机 ============================ */
class Wingman {
  constructor() { this.active = false; }
  init(side, color, level) {
    this.side = side;
    this.color = color;
    this.level = level || 1;
    this.x = 0; this.y = 0;
    this.fireTimer = 0;
    this.t = 0;
  }
  update(dt, player, fire) {
    this.t += dt;
    const tx = player.x + this.side * 56;
    const ty = player.y + 26;
    const k = 1 - Math.pow(0.0008, dt);
    this.x += (tx - this.x) * k;
    this.y += (ty - this.y) * k;
    this.fireTimer -= dt;
    if (fire && this.fireTimer <= 0) {
      this.fireTimer = 0.16;
      return true;
    }
    return false;
  }
  render(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(ctx, 0, 4, 12, this.color, 0.5);
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(9, 9); ctx.lineTo(0, 5); ctx.lineTo(-9, 9);
    ctx.closePath();
    ctx.fillStyle = hexAlpha(this.color, 0.85);
    ctx.fill();
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

/* ============================ 粒子 ============================ */
class Particle {
  constructor() { this.active = false; }
  init(o) {
    this.kind = o.kind || 'spark';
    this.x = o.x; this.y = o.y;
    this.vx = o.vx || 0; this.vy = o.vy || 0;
    this.life = o.life || 0.5;
    this.maxLife = this.life;
    this.size = o.size || 3;
    this.color = o.color || '#FFFFFF';
    this.drag = o.drag === undefined ? 2.4 : o.drag;
    this.gravity = o.gravity || 0;
    this.rot = o.rot || 0;
    this.spin = o.spin || 0;
    this.maxR = o.maxR || 60;
    this.width = o.width || 3;
  }
  update(dt) {
    this.life -= dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.drag) { const k = Math.max(0, 1 - this.drag * dt); this.vx *= k; this.vy *= k; }
    if (this.gravity) this.vy += this.gravity * dt;
    if (this.spin) this.rot += this.spin * dt;
  }
  render(ctx) {
    const t = clamp(this.life / this.maxLife, 0, 1);
    switch (this.kind) {
      case 'spark':
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = t;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * (0.4 + t * 0.6), 0, TAU);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        break;
      case 'glow':
        drawGlow(ctx, this.x, this.y, this.size * (0.6 + t * 1.4), this.color, t * 0.85);
        break;
      case 'ring': {
        const r = this.maxR * (1 - t);
        ctx.globalAlpha = t * 0.9;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, TAU);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.width * t;
        ctx.stroke();
        ctx.globalAlpha = 1;
        break;
      }
      case 'debris':
        ctx.globalAlpha = t;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
        ctx.restore();
        ctx.globalAlpha = 1;
        break;
      case 'shock':
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.maxR * (1 - t * t), 0, TAU);
        ctx.strokeStyle = hexAlpha(this.color, t * 0.8);
        ctx.lineWidth = this.width * t;
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
        break;
    }
  }
}

/* ============================ 粒子生成辅助 ============================ */
function spawnExplosion(pool, x, y, color, scale) {
  scale = scale || 1;
  const n = Math.round(12 * scale);
  for (let i = 0; i < n; i++) {
    const p = pool.acquire();
    if (!p) break;
    const a = Math.random() * TAU;
    const sp = randRange(60, 280) * scale;
    p.init({
      kind: Math.random() < 0.3 ? 'debris' : 'spark',
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: randRange(0.25, 0.6), size: randRange(1.6, 4.4) * scale,
      color, drag: 2.6, gravity: 40, spin: randRange(-8, 8)
    });
  }
  const g = pool.acquire();
  if (g) g.init({ kind: 'glow', x, y, life: 0.28, size: 22 * scale, color, drag: 1 });
  const r = pool.acquire();
  if (r) r.init({ kind: 'shock', x, y, life: 0.34, maxR: 52 * scale, color, width: 6 });
}

function spawnHitSpark(pool, x, y, color) {
  for (let i = 0; i < 4; i++) {
    const p = pool.acquire();
    if (!p) break;
    const a = Math.random() * TAU;
    p.init({
      kind: 'spark', x, y,
      vx: Math.cos(a) * randRange(30, 130), vy: Math.sin(a) * randRange(30, 130) - 40,
      life: randRange(0.12, 0.28), size: randRange(1.2, 2.6), color, drag: 3
    });
  }
}

function spawnRing(pool, x, y, color, maxR) {
  const p = pool.acquire();
  if (p) p.init({ kind: 'ring', x, y, life: 0.42, maxR: maxR || 90, color, width: 5 });
}

function spawnTrail(pool, x, y, color, size) {

  if (p) p.init({ kind: 'glow', x, y, life: 0.24, size: size || 7, color, drag: 3 });
}

// 系统层：武器射击 / 弹幕解释器 / 敌机波次 / Boss 弹幕编排 / 碰撞 / 掉落 / 连击 / 技能

/* ============================ 对象池创建 ============================ */
function createPools() {
  return {
    playerBullet: new Pool(POOL_SIZE.playerBullet, () => new Bullet()),
    enemyBullet: new Pool(POOL_SIZE.enemyBullet, () => new Bullet()),
    enemy: new Pool(POOL_SIZE.enemy, () => new Enemy()),
    particle: new Pool(POOL_SIZE.particle, () => new Particle()),
    pickup: new Pool(POOL_SIZE.pickup, () => new Pickup()),
    beam: new Pool(POOL_SIZE.beam, () => new Beam()),
    wingman: new Pool(4, () => new Wingman())
  };
}

const enemyGrid = new SpatialGrid(PHYS.gridCell);
const _bQuery = [];

/* ============================ 弹幕解释器 ============================ */
function spawnPattern(name, x, y, opts, pools, target) {
  const base = PATTERNS[name];
  if (!base) return;
  const o = opts ? Object.assign({}, base, opts) : base;
  const pool = o.faction === 'player' ? pools.playerBullet : pools.enemyBullet;
  const speedMul = o.speedMul || 1;
  const spd = (o.speed || 200) * speedMul;
  const radius = o.radius || 7;
  const color = o.color || THEME.dangerRed;
  const sprite = o.sprite || 'orb';

  switch (o.kind) {
    case 'aimed': {
      const n = o.count || 1;
      const baseA = o.aim && target ? angleTo(x, y, target.x, target.y)
        : (o.angleDeg !== undefined ? o.angleDeg * DEG : Math.PI / 2);
      const spread = (o.spreadDeg || 10) * DEG;
      for (let i = 0; i < n; i++) {
        const a = baseA + (n === 1 ? 0 : -spread / 2 + spread * i / (n - 1));
        spawnOne(pool, x, y, a, spd, radius, color, sprite, o);
      }
      break;
    }
    case 'spread': {
      const n = o.count || 5;
      const baseA = o.aim && target ? angleTo(x, y, target.x, target.y) : Math.PI / 2;
      const spread = (o.spreadDeg || 60) * DEG;
      const off = (o.offsetDeg || 0) * DEG;
      for (let i = 0; i < n; i++) {
        const a = baseA + off + (n === 1 ? 0 : -spread / 2 + spread * i / (n - 1));
        spawnOne(pool, x, y, a, spd, radius, color, sprite, o);
      }
      break;
    }
    case 'ring': {
      const n = o.count || 16;
      const off = (o.offsetDeg || 0) * DEG;
      for (let i = 0; i < n; i++) {
        const a = off + i / n * TAU;
        spawnOne(pool, x, y, a, spd, radius, color, sprite, o);
      }
      break;
    }
    case 'spiral': {
      const n = o.count || 3;
      const off = (o.offsetDeg || 0) * DEG;
      for (let i = 0; i < n; i++) {
        const a = off + i / n * TAU;
        spawnOne(pool, x, y, a, spd, radius, color, sprite, o);
      }
      break;
    }
    case 'wall': {
      const n = o.count || 14;
      const gap = o.gapIndex === undefined ? 6 : o.gapIndex;
      const gapW = o.gapWidth || 2;
      const margin = 40;
      const step = (GAME_W - margin * 2) / (n - 1);
      for (let i = 0; i < n; i++) {
        if (i >= gap && i < gap + gapW) continue;
        const px = margin + step * i;
        spawnOne(pool, px, y, Math.PI / 2, spd, radius, color, sprite, o, 0);
      }
      break;
    }
    case 'homing': {
      const n = o.count || 2;
      const baseA = target ? angleTo(x, y, target.x, target.y) : Math.PI / 2;
      const spread = 40 * DEG;
      for (let i = 0; i < n; i++) {
        const a = baseA + (n === 1 ? 0 : -spread / 2 + spread * i / (n - 1));
        spawnOne(pool, x, y, a, spd, radius, color, sprite, o,
          { homing: o.homing || 1, turnRate: o.turnRate || 1.6, life: o.life || 4.5, target });
      }
      break;
    }
    case 'laser': {
      const b = pools.beam.acquire();
      if (!b) break;
      const angle = o.angleDeg !== undefined ? o.angleDeg * DEG : Math.PI / 2;
      b.init({
        x, y, angle,
        width: o.width || 24,
        length: GAME_H * 1.4,
        color, faction: 'enemy',
        warnTime: o.warnTime === undefined ? 1.0 : o.warnTime,
        activeTime: o.activeTime === undefined ? 1.4 : o.activeTime,
        rotateSpeed: (o.rotateSpeed || 0) * (o.rotateDir || 1)
      });
      break;
    }
    case 'mine': {
      const n = o.count || 3;
      const spread = 70 * DEG;
      for (let i = 0; i < n; i++) {
        const a = Math.PI / 2 + (n === 1 ? 0 : -spread / 2 + spread * i / (n - 1));
        const b = spawnOne(pool, x, y, a, spd, radius + 2, color, 'orb', o, { life: 8 });
        if (b) {
          b.mineT = o.travelTime || 1.6;
          b.minePattern = o.burstPattern || 'ringBurst';
          b.mineCount = o.burstCount || 10;
        }
      }
      break;
    }
  }
}

function spawnOne(pool, x, y, angle, spd, radius, color, sprite, o, extra) {
  const b = pool.acquire();
  if (!b) return null;
  const cfg = {
    x, y,
    vx: Math.cos(angle) * spd,
    vy: Math.sin(angle) * spd,
    radius,
    damage: o.damage || 1,
    faction: o.faction || 'enemy',
    color, sprite,
    pierce: o.pierce || 0,
    explodeRadius: o.explodeRadius || 0,
    life: o.life || 8
  };
  if (extra) Object.assign(cfg, extra);
  b.init(cfg);
  return b;
}

/* ============================ 玩家武器 ============================ */
function nearestTarget(enemies, boss, x, y) {
  let best = null, bestD = Infinity;
  for (let i = 0; i < enemies.items.length; i++) {
    const e = enemies.items[i];
    if (!e.active) continue;
    const d = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y);
    if (d < bestD) { bestD = d; best = e; }
  }
  if (boss && boss.active && boss.state !== 'dying') {
    const d = (boss.x - x) * (boss.x - x) + (boss.y - y) * (boss.y - y);
    if (d < bestD) { bestD = d; best = boss; }
  }
  return best;
}

function updateWeapon(player, pools, dt, enemies, boss) {
  const wpn = WEAPONS[player.weaponId];
  const lv = wpn.levels[clamp(player.power - 1, 0, wpn.levels.length - 1)];

  // —— 激光：持续光束 ——
  if (wpn.kind === 'laser') {
    if (player.beam && !player.beam.active) player.beam = null;
    if (!player.beam) {
      const b = pools.beam.acquire();
      if (b) {
        b.init({
          x: player.x, y: player.y - 20, angle: -Math.PI / 2, width: lv.width * lv.beams,
          length: GAME_H, color: wpn.color, faction: 'player',
          warnTime: 0, activeTime: 9999, follow: player, dps: lv.dps
        });
        b.beamTick = 0.1;
        player.beam = b;
      }
    } else {
      const b = player.beam;
      b.width = lv.width * lv.beams;
      b.dps = lv.dps * player.damageMul;
      b.beamTick -= dt;
    }
    return;
  }
  if (player.beam) { pools.beam.release(player.beam); player.beam = null; }

  // —— 其他武器：冷却驱动 ——
  player.fireTimer -= dt;
  if (player.fireTimer > 0) return;
  const cd = wpn.baseCooldown / player.fireRateMul;
  player.fireTimer = cd;

  const dmg = lv.damage * player.damageMul;
  const pierce = lv.pierce + player.pierceBonus;
  const n = lv.count || 1;
  const spread = (lv.spreadDeg || 0) * DEG;
  const target = lv.homing ? nearestTarget(enemies, boss, player.x, player.y) : null;

  const muzzle = player.y - 26;

  if (wpn.kind === 'railgun') {
    // 磁轨炮：一次齐射，弹体极快、无限穿透
    for (let i = 0; i < n; i++) {
      const offX = (i - (n - 1) / 2) * 18;
      const b = pools.playerBullet.acquire();
      if (!b) break;
      b.init({
        x: player.x + offX, y: muzzle,
        vx: 0, vy: -lv.speed,
        radius: lv.radius, damage: dmg, faction: 'player',
        color: wpn.color, sprite: 'shard', pierce: 999, life: 2.2
      });
    }
    spawnRing(pools.particle, player.x, muzzle, wpn.color, 70);
    camera.shake(4, 0.12);
    return;
  }

  for (let i = 0; i < n; i++) {
    let a, ox;
    if (n === 1) { a = -Math.PI / 2; ox = 0; }
    else {
      const t = i / (n - 1) - 0.5;
      a = -Math.PI / 2 + t * spread;
      ox = t * Math.min(56, n * 7);
    }
    const b = pools.playerBullet.acquire();
    if (!b) break;
    b.init({
      x: player.x + ox, y: muzzle,
      vx: Math.cos(a) * lv.speed, vy: Math.sin(a) * lv.speed,
      radius: lv.radius, damage: dmg, faction: 'player',
      color: wpn.color,
      sprite: lv.homing ? 'missile' : 'dart',
      pierce,
      explodeRadius: lv.explodeRadius || 0,
      homing: lv.homing || 0,
      turnRate: lv.turnRate || 0,
      target,
      life: 5
    });
  }
}
